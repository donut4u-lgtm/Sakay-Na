name: Create Sakay Na Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Create release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAKAYNA_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing SAKAYNA_KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "Missing SAKAYNA_KEY_ALIAS"
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore sakayna-release.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Sakay Na, OU=Sakay Na, O=Sakay Na, L=Philippines, ST=Bicol, C=PH"

          test -s sakayna-release.jks

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 sakayna-release.jks > sakayna-release.jks.base64
          test -s sakayna-release.jks.base64

      - name: Upload release keystore
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-keystore
          path: |
            sakayna-release.jks
            sakayna-release.jks.base64
          retention-days: 7

### After you paste it

Tap **Commit changes**.

Then:

**Actions → Create Sakay Na Release Keystore → Run workflow**

That workflow will create the `.jks` using the **existing** password and alias secrets and produce an artifact.

**Do not send me the password, alias, JKS, or Base64 value.** Just tell me when the workflow is **Green 🟢**.
