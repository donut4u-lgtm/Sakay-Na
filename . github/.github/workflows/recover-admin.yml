name: Recover Sakay Na Admin

on:
  workflow_dispatch:

jobs:
  recover-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Recover and VERIFY Admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_PHONE: ${{ secrets.SAKAYNA_ADMIN_PHONE }}
          ADMIN_PASSWORD: ${{ secrets.SAKAYNA_ADMIN_PASSWORD }}
        run: |
          cat > recover-admin.js <<'EOF'
          const admin = require("firebase-admin");

          const rawServiceAccount =
            process.env.FIREBASE_SERVICE_ACCOUNT;

          if (!rawServiceAccount) {
            throw new Error(
              "RED: FIREBASE_SERVICE_ACCOUNT secret is missing."
            );
          }

          let serviceAccount;

          try {
            serviceAccount = JSON.parse(rawServiceAccount);
          } catch (error) {
            throw new Error(
              "RED: FIREBASE_SERVICE_ACCOUNT is not valid JSON."
            );
          }

          const EXPECTED_PROJECT =
            "sakay-na-1cafa";

          if (serviceAccount.project_id !== EXPECTED_PROJECT) {
            throw new Error(
              "RED: Firebase service account belongs to project '" +
              serviceAccount.project_id +
              "', not '" +
              EXPECTED_PROJECT +
              "'."
            );
          }

          console.log(
            "GREEN: Firebase project verified: " +
            EXPECTED_PROJECT
          );

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            projectId: EXPECTED_PROJECT
          });

          const auth = admin.auth();
          const db = admin.firestore();

          const ADMIN_UID =
            "Ld3rzaCvAGNlXBDCofB3mWjgXWp2";

          const phone =
            (process.env.ADMIN_PHONE || "").trim();

          const password =
            process.env.ADMIN_PASSWORD || "";

          if (!phone) {
            throw new Error(
              "RED: SAKAYNA_ADMIN_PHONE secret is missing."
            );
          }

          if (!password) {
            throw new Error(
              "RED: SAKAYNA_ADMIN_PASSWORD secret is missing."
            );
          }

          function normalizePhone(value) {
            let p = value.replace(/[^0-9+]/g, "");

            if (p.startsWith("+63")) {
              p = "63" + p.substring(3);
            } else if (p.startsWith("09")) {
              p = "63" + p.substring(1);
            } else if (
              p.startsWith("9") &&
              p.length === 10
            ) {
              p = "63" + p;
            }

            if (!/^63[0-9]{10}$/.test(p)) {
              throw new Error(
                "RED: Invalid Philippine phone format."
              );
            }

            return p;
          }

          async function main() {
            const normalizedPhone =
              normalizePhone(phone);

            const syntheticEmail =
              normalizedPhone + "@sakayna.app";

            console.log(
              "Checking Admin UID..."
            );

            let userExists = false;

            try {
              await auth.getUser(ADMIN_UID);
              userExists = true;

              console.log(
                "Admin UID already exists."
              );
            } catch (error) {
              if (
                error.code !==
                "auth/user-not-found"
              ) {
                throw error;
              }

              console.log(
                "Admin UID does not exist."
              );
            }

            if (!userExists) {
              console.log(
                "Creating Admin Auth account..."
              );

              await auth.createUser({
                uid: ADMIN_UID,
                email: syntheticEmail,
                password: password,
                displayName: "Sakay Na Admin",
                disabled: false
              });

              console.log(
                "Admin Auth account creation completed."
              );
            }

            console.log(
              "Updating Admin Auth account..."
            );

            await auth.updateUser(
              ADMIN_UID,
              {
                email: syntheticEmail,
                password: password,
                displayName: "Sakay Na Admin",
                disabled: false
              }
            );

            console.log(
              "Admin Auth account update completed."
            );

            console.log(
              "Verifying Admin Auth account..."
            );

            const verifiedUser =
              await auth.getUser(ADMIN_UID);

            if (verifiedUser.uid !== ADMIN_UID) {
              throw new Error(
                "RED: Firebase returned the wrong Admin UID."
              );
            }

            if (verifiedUser.disabled) {
              throw new Error(
                "RED: Admin Auth account is disabled."
              );
            }

            if (
              verifiedUser.email !==
              syntheticEmail
            ) {
              throw new Error(
                "RED: Admin email verification failed."
              );
            }

            console.log(
              "GREEN: Admin Auth UID verified."
            );

            await db
              .collection("users")
              .doc(ADMIN_UID)
              .set(
                {
                  uid: ADMIN_UID,
                  role: "ADMIN",
                  admin: true,
                  name: "Sakay Na Admin",
                  phone: phone,
                  phoneNumber: phone,
                  email: syntheticEmail,
                  updatedAt:
                    admin.firestore.FieldValue.serverTimestamp()
                },
                {
                  merge: true
                }
              );

            console.log(
              "GREEN: Admin Firestore profile restored."
            );

            const verifyDoc =
              await db
                .collection("users")
                .doc(ADMIN_UID)
                .get();

            if (!verifyDoc.exists) {
              throw new Error(
                "RED: Admin Firestore document was not created."
              );
            }

            const data = verifyDoc.data();

            if (data.role !== "ADMIN") {
              throw new Error(
                "RED: Admin Firestore role verification failed."
              );
            }

            console.log(
              "GREEN: Admin Firestore document verified."
            );

            console.log("");
            console.log(
              "========================================"
            );
            console.log(
              "GREEN: ADMIN RECOVERY VERIFIED"
            );
            console.log(
              "========================================"
            );
            console.log(
              "Firebase project: sakay-na-1cafa"
            );
            console.log(
              "Admin UID verified successfully."
            );
            console.log(
              "========================================"
            );
          }

          main().catch(error => {
            console.error("");
            console.error(
              "========================================"
            );
            console.error(
              "RED: ADMIN RECOVERY FAILED"
            );
            console.error(
              "========================================"
            );
            console.error(
              error.message || error
            );
            console.error(
              "========================================"
            );
            process.exit(1);
          });
          EOF

          node recover-admin.js

      - name: GREEN
        run: |
          echo "========================================"
          echo "GREEN: ADMIN ACCOUNT RESTORED AND VERIFIED"
          echo "========================================"
