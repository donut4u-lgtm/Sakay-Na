
name: Recover Sakay Na Admin

on:
  workflow_dispatch:

jobs:
  recover-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Recover Admin Account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_PHONE: ${{ secrets.SAKAYNA_ADMIN_PHONE }}
          ADMIN_PASSWORD: ${{ secrets.SAKAYNA_ADMIN_PASSWORD }}
        run: |
          cat > recover-admin.js <<'EOF'
          const admin = require("firebase-admin");

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            projectId: "sakay-na-1cafa"
          });

          const db = admin.firestore();
          const auth = admin.auth();

          const ADMIN_UID =
            "Ld3rzaCvAGNlXBDCofB3mWjgXWp2";

          const phone = (process.env.ADMIN_PHONE || "").trim();
          const password = process.env.ADMIN_PASSWORD || "";

          function normalizePhone(value) {
            let p = value.replace(/[^0-9+]/g, "");

            if (p.startsWith("+63")) {
              p = "63" + p.substring(3);
            } else if (p.startsWith("09")) {
              p = "63" + p.substring(1);
            } else if (p.startsWith("9") && p.length === 10) {
              p = "63" + p;
            }

            if (!/^63[0-9]{10}$/.test(p)) {
              throw new Error(
                "Invalid Philippine phone format in SAKAYNA_ADMIN_PHONE secret."
              );
            }

            return p;
          }

          async function main() {
            if (!process.env.FIREBASE_SERVICE_ACCOUNT) {
              throw new Error("FIREBASE_SERVICE_ACCOUNT secret is missing.");
            }

            if (!phone) {
              throw new Error("SAKAYNA_ADMIN_PHONE secret is missing.");
            }

            if (!password) {
              throw new Error("SAKAYNA_ADMIN_PASSWORD secret is missing.");
            }

            const normalizedPhone = normalizePhone(phone);
            const syntheticEmail =
              normalizedPhone + "@sakayna.app";

            console.log("Checking Admin UID...");

            let existingUser = null;

            try {
              existingUser = await auth.getUser(ADMIN_UID);
              console.log("Admin UID already exists.");
            } catch (error) {
              if (error.code !== "auth/user-not-found") {
                throw error;
              }

              console.log("Admin UID does not exist. Creating it...");

              await auth.createUser({
                uid: ADMIN_UID,
                email: syntheticEmail,
                password: password,
                displayName: "Sakay Na Admin",
                disabled: false
              });

              console.log("Admin Auth account created.");
            }

            await auth.updateUser(ADMIN_UID, {
              email: syntheticEmail,
              password: password,
              displayName: "Sakay Na Admin",
              disabled: false
            });

            console.log("Admin Auth account updated.");

            await db
              .collection("users")
              .doc(ADMIN_UID)
              .set(
                {
                  uid: ADMIN_UID,
                  role: "ADMIN",
                  admin: true,
                  name: "Sakay Na Admin",
                  phone: phone,
                  phoneNumber: phone,
                  email: syntheticEmail,
                  updatedAt:
                    admin.firestore.FieldValue.serverTimestamp()
                },
                { merge: true }
              );

            console.log("Admin Firestore profile restored.");

            console.log("");
            console.log("========================================");
            console.log("GREEN: ADMIN RECOVERY SUCCESSFUL");
            console.log("========================================");
            console.log("Admin UID restored:");
            console.log(ADMIN_UID);
            console.log("========================================");
          }

          main().catch(error => {
            console.error("");
            console.error("RED: ADMIN RECOVERY FAILED");
            console.error(error.message || error);
            process.exit(1);
          });
          EOF

          node recover-admin.js

      - name: GREEN
        run: |
          echo "========================================"
          echo "GREEN: ADMIN ACCOUNT RESTORED"
          echo "========================================"
