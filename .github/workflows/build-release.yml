name: Build Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing SAKAYNA_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing SAKAYNA_KEYSTORE_PASSWORD"
            exit 1
          fi

          echo "Signing secrets are present."

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "Keystore restore failed."
            exit 1
          fi

          echo "Release keystore restored."

      - name: Detect keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          ALIAS=$(keytool -list \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            2>/dev/null \
            | awk -F, '/PrivateKeyEntry/ {print $1; exit}')

          if [ -z "$ALIAS" ]; then
            echo "No PrivateKeyEntry alias found."
            exit 1
          fi

          echo "Release alias detected."
          echo "SAKAYNA_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ runner.temp }}/sakayna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          export PATH="$RUNNER_TEMP/gradle/gradle-8.10.2/bin:$PATH"

          echo "Building signed release APK..."
          gradle :app:assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "Release APK was not produced."
            exit 1
          fi

          echo "Signed release APK produced successfully."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
