name: Build Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAKAYNA_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing SAKAYNA_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing SAKAYNA_KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "Missing SAKAYNA_KEY_ALIAS"
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakyna-release.jks"
          test -s "$RUNNER_TEMP/sakyna-release.jks"

      - name: Build signed release APK
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ runner.temp }}/sakyna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
          SAKAYNA_KEY_ALIAS: ${{ secrets.SAKAYNA_KEY_ALIAS }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          export PATH="$RUNNER_TEMP/gradle/gradle-8.10.2/bin:$PATH"
          gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
