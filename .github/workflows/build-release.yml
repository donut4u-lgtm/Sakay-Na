      - name: Detect keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          ALIAS=$(keytool -list \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            | awk -F, '/PrivateKeyEntry/ {print $1; exit}')

          if [ -z "$ALIAS" ]; then
            echo "No PrivateKeyEntry alias found."
            exit 1
          fi

          echo "Detected release alias: $ALIAS"
          echo "SAKAYNA_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
