name: Build Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing SAKAYNA_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing SAKAYNA_KEYSTORE_PASSWORD"
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "Keystore restore failed."
            exit 1
          fi

          echo "Keystore restored."

      - name: Detect actual keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          ALIAS=$(keytool -list \
            -v \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            2>/dev/null \
            | awk -F': ' '/Alias name:/ {print $2; exit}')

          if [ -z "$ALIAS" ]; then
            echo "Could not detect keystore alias."
            exit 1
          fi

          echo "Keystore alias detected."
          echo "SAKAYNA_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Read app version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read app version."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Release version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

      - name: Build signed release APK
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ runner.temp }}/sakayna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          export PATH="$RUNNER_TEMP/gradle/gradle-8.10.2/bin:$PATH"

          gradle :app:assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          if [ ! -s "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Release APK was not produced."
            exit 1
          fi

          echo "Release APK created successfully."

      - name: Prepare public release asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "Sakay-Na-v${VERSION_CODE}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then

            echo "Release $TAG already exists."

            gh release upload "$TAG" \
              "Sakay-Na-v${VERSION_CODE}.apk" \
              --repo "${{ github.repository }}" \
              --clobber

            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --latest

          else

            gh release create "$TAG" \
              "Sakay-Na-v${VERSION_CODE}.apk" \
              --repo "${{ github.repository }}" \
              --title "Sakay Na ${VERSION_NAME}" \
              --notes "Sakay Na public release ${VERSION_NAME} (version code ${VERSION_CODE})." \
              --latest

          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-apk
          path: Sakay-Na-v${{ env.VERSION_CODE }}.apk
          if-no-files-found: error
