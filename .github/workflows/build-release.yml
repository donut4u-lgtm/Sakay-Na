name: Build Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RED: Missing SAKAYNA_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "RED: Missing KEYSTORE_PASSWORD"
            exit 1
          fi

          echo "GREEN: Signing secrets are present."

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "RED: Keystore restore failed."
            exit 1
          fi

          echo "GREEN: Keystore restored."

      - name: Verify correct signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -v \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/keystore-info.txt" 2>&1

          if [ $? -ne 0 ]; then
            echo "RED: KEYSTORE_PASSWORD cannot open the keystore."
            exit 1
          fi

          ALIAS=$(awk -F': ' '/Alias name:/ {
            print $2
            exit
          }' "$RUNNER_TEMP/keystore-info.txt")

          CERT=$(awk -F': ' '/SHA256:/ {
            gsub(/[ :]/, "", $2)
            print tolower($2)
            exit
          }' "$RUNNER_TEMP/keystore-info.txt")

          EXPECTED="14904b17ad9917b5daf05f0655e56176e7b13bbbdec0d2cccecd09de017916d4"

          if [ -z "$ALIAS" ]; then
            echo "RED: No signing alias found."
            exit 1
          fi

          echo "Signing alias detected."

          if [ -z "$CERT" ]; then
            echo "RED: No SHA-256 certificate found."
            exit 1
          fi

          if [ "$CERT" != "$EXPECTED" ]; then
            echo "RED: WRONG SIGNING KEY"
            echo "Expected installed-app certificate:"
            echo "$EXPECTED"
            echo "Keystore certificate:"
            echo "$CERT"
            exit 1
          fi

          echo "GREEN: Correct Sakay Na signing certificate confirmed."

          echo "SAKAYNA_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Read app version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts \
            | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts \
            | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')

          if [ -z "$VERSION_NAME" ]; then
            echo "RED: versionName not found."
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "RED: versionCode not found."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "GREEN: Version $VERSION_NAME"
          echo "GREEN: Version code $VERSION_CODE"

      - name: Build signed release
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ runner.temp }}/sakayna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip \
            -d "$RUNNER_TEMP/gradle"

          export PATH="$RUNNER_TEMP/gradle/gradle-8.10.2/bin:$PATH"

          gradle :app:assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "RED: Release APK was not produced."
            exit 1
          fi

          echo "GREEN: Release APK created."

      - name: Verify final APK certificate
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "RED: apksigner not found."
            exit 1
          fi

          echo "Checking final APK certificate..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          CERT=$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" 2>&1 \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {
                  gsub(/[ :]/, "", $2)
                  print tolower($2)
                  exit
                }'
          )

          EXPECTED="14904b17ad9917b5daf05f0655e56176e7b13bbbdec0d2cccecd09de017916d4"

          echo "Expected certificate:"
          echo "$EXPECTED"

          echo "Actual APK certificate:"
          echo "$CERT"

          if [ "$CERT" != "$EXPECTED" ]; then
            echo "RED: FINAL APK SIGNING CERTIFICATE DOES NOT MATCH."
            exit 1
          fi

          echo "GREEN: FINAL APK CERTIFICATE MATCHES INSTALLED SAKAY NA."

      - name: Prepare release APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            "Sakay-Na-v${VERSION_NAME}-${VERSION_CODE}.apk"

          echo "GREEN: Release APK prepared."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          APK="Sakay-Na-v${VERSION_NAME}-${VERSION_CODE}.apk"

          if gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then

            echo "Updating existing release $TAG"

            gh release upload "$TAG" \
              "$APK" \
              --repo "${{ github.repository }}" \
              --clobber

            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --latest

          else

            echo "Creating release $TAG"

            gh release create "$TAG" \
              "$APK" \
              --repo "${{ github.repository }}" \
              --title "Sakay Na ${VERSION_NAME}" \
              --notes "Signed Sakay Na release ${VERSION_NAME}, version code ${VERSION_CODE}." \
              --latest

          fi

          echo "GREEN: GitHub Release published."

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-apk
          path: Sakay-Na-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}.apk
          if-no-files-found: error
