name: Repair Sakay Na Passenger Driver Auth

on:
  workflow_dispatch:

jobs:
  repair-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Firebase Admin SDK
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Repair Passenger and Driver Login IDs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e

          test -n "$FIREBASE_SERVICE_ACCOUNT"

          python <<'PY'
          import json
          import os
          import re

          import firebase_admin
          from firebase_admin import credentials
          from firebase_admin import auth
          from firebase_admin import firestore

          PROJECT_ID = "sakay-na-1cafa"

          service_account = json.loads(
              os.environ["FIREBASE_SERVICE_ACCOUNT"]
          )

          if service_account.get("project_id") != PROJECT_ID:
              raise RuntimeError(
                  "RED: Wrong Firebase project."
              )

          firebase_admin.initialize_app(
              credentials.Certificate(service_account),
              {
                  "projectId": PROJECT_ID
              }
          )

          db = firestore.client()

          def normalize_phone(value):
              digits = re.sub(
                  r"\D",
                  "",
                  str(value or "")
              )

              if digits.startswith("63"):
                  normalized = digits

              elif digits.startswith("09"):
                  normalized = "63" + digits[1:]

              elif digits.startswith("9") and len(digits) == 10:
                  normalized = "63" + digits

              else:
                  return ""

              if re.fullmatch(
                  r"63\d{10}",
                  normalized
              ):
                  return normalized

              return ""

          repaired = 0
          already_ok = 0
          missing_auth = 0
          skipped = 0

          print("========================================")
          print("SAKAY NA PASSENGER / DRIVER AUTH REPAIR")
          print("Firebase project:", PROJECT_ID)
          print("========================================")

          for doc in db.collection("users").stream():

              data = doc.to_dict() or {}

              role = str(
                  data.get("role")
                  or data.get("accountType")
                  or ""
              ).upper()

              if role not in ("PASSENGER", "DRIVER"):
                  continue

              phone = normalize_phone(
                  data.get("phone")
                  or data.get("phoneNumber")
              )

              if not phone:
                  print(
                      f"SKIP: {doc.id} has no valid phone"
                  )
                  skipped += 1
                  continue

              expected_email = (
                  phone + "@sakayna.app"
              )

              try:
                  user = auth.get_user(doc.id)

              except auth.UserNotFoundError:
                  print(
                      f"RED: No Auth user for "
                      f"{doc.id} "
                      f"({role}, {phone})"
                  )
                  missing_auth += 1
                  continue

              actual_email = user.email or ""

              if actual_email == expected_email:
                  print(
                      f"GREEN: {role} {phone} "
                      f"already correct"
                  )
                  already_ok += 1
                  continue

              try:
                  conflict = auth.get_user_by_email(
                      expected_email
                  )

                  if conflict.uid != user.uid:
                      raise RuntimeError(
                          f"RED: {expected_email} "
                          f"already belongs to another UID"
                      )

              except auth.UserNotFoundError:
                  pass

              print(
                  f"FIX: {role} {phone}: "
                  f"{actual_email or '<none>'} "
                  f"-> {expected_email}"
              )

              auth.update_user(
                  user.uid,
                  email=expected_email,
                  disabled=False
              )

              repaired += 1

              print(
                  f"GREEN: repaired {user.uid}"
              )

          print("========================================")
          print(
              "GREEN: PASSENGER/DRIVER "
              "AUTH REPAIR COMPLETE"
          )
          print(
              f"Repaired: {repaired}"
          )
          print(
              f"Already correct: {already_ok}"
          )
          print(
              f"Missing Auth: {missing_auth}"
          )
          print(
              f"Skipped: {skipped}"
          )
          print("========================================")
          PY
