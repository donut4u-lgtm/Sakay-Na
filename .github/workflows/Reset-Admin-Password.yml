name: Verify Sakay Na Admin

on:
  workflow_dispatch:

jobs:
  verify-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Check Admin
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ADMIN_PASSWORD: ${{ secrets.SAKAYNA_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);

          console.log("");
          console.log("========== SAKAY NA ADMIN CHECK ==========");
          console.log("Firebase project:", serviceAccount.project_id);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const uid = "Ld3rzaCvAGNlXBDCofB3mWjgXWp2";

          async function check() {
            const user = await admin.auth().getUser(uid);

            console.log("Admin UID:", user.uid);
            console.log("Admin email:", user.email);
            console.log("Admin disabled:", user.disabled);
            console.log("Email verified:", user.emailVerified);
            console.log(
              "Provider:",
              user.providerData.map(p => p.providerId).join(", ")
            );

            await admin.auth().updateUser(uid, {
              password: process.env.ADMIN_PASSWORD,
              disabled: false
            });

            console.log("");
            console.log("GREEN: ADMIN PASSWORD RESET COMPLETE");
            console.log("==========================================");
          }

          check().catch(error => {
            console.error("RED:", error.message);
            process.exit(1);
          });
          NODE
