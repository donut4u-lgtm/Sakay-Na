name: Test Sakay Na Admin Login

on:
  workflow_dispatch:

jobs:
  test-admin-login:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Firebase Admin credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ADMIN_PASSWORD: ${{ secrets.SAKAYNA_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");
          const https = require("https");

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const uid = "Ld3rzaCvAGNlXBDCofB3mWjgXWp2";

          async function run() {
            const user = await admin.auth().getUser(uid);

            console.log("================================");
            console.log("SAKAY NA ADMIN FIREBASE TEST");
            console.log("================================");
            console.log("Firebase project:", serviceAccount.project_id);
            console.log("Admin UID:", user.uid);
            console.log("Admin email:", user.email);
            console.log("Admin disabled:", user.disabled);

            const url =
              "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" +
              serviceAccount.apiKey;

            const body = JSON.stringify({
              email: user.email,
              password: process.env.ADMIN_PASSWORD,
              returnSecureToken: true
            });

            const request = https.request(
              url,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Content-Length": Buffer.byteLength(body)
                }
              },
              response => {
                let data = "";

                response.on("data", chunk => {
                  data += chunk;
                });

                response.on("end", () => {
                  let result;

                  try {
                    result = JSON.parse(data);
                  } catch {
                    console.log("RED: Invalid Firebase response.");
                    process.exit(1);
                  }

                  if (response.statusCode === 200) {
                    console.log("");
                    console.log("GREEN: FIREBASE ADMIN LOGIN WORKS");
                    console.log("Returned UID:", result.localId);
                    console.log("Returned email:", result.email);
                    console.log("");
                    process.exit(0);
                  }

                  console.log("");
                  console.log("RED: FIREBASE ADMIN LOGIN FAILED");
                  console.log("Firebase error:", result?.error?.message || "UNKNOWN");
                  console.log("");
                  process.exit(1);
                });
              }
            );

            request.on("error", error => {
              console.log("RED:", error.message);
              process.exit(1);
            });

            request.write(body);
            request.end();
          }

          run().catch(error => {
            console.log("RED:", error.message);
            process.exit(1);
          });
          NODE
