name: Reset Sakay Na Admin Password

on:
  workflow_dispatch:

jobs:
  reset-admin-password:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Reset existing Admin password
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ADMIN_PASSWORD: ${{ secrets.SAKAYNA_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);

          const password = process.env.ADMIN_PASSWORD;

          if (!password || password.length < 6) {
            throw new Error(
              "SAKAYNA_ADMIN_PASSWORD must be at least 6 characters."
            );
          }

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const adminUid =
            "Ld3rzaCvAGNlXBDCofB3mWjgXWp2";

          admin.auth()
            .updateUser(adminUid, {
              password: password,
              disabled: false
            })
            .then(userRecord => {
              console.log(
                "GREEN: Admin password updated successfully."
              );
              console.log(
                "Admin UID:",
                userRecord.uid
              );
              process.exit(0);
            })
            .catch(error => {
              console.error(
                "RED: Admin password update failed."
              );
              console.error(error.message);
              process.exit(1);
            });
          NODE
