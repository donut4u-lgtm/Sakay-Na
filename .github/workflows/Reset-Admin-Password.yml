name: Verify and Reset Sakay Na Admin

on:
  workflow_dispatch:

jobs:
  verify-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Verify Firebase project and Admin
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ADMIN_PASSWORD: ${{ secrets.SAKAYNA_ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);

          const password = process.env.ADMIN_PASSWORD;

          if (!password || password.length < 6) {
            throw new Error(
              "RED: SAKAYNA_ADMIN_PASSWORD is missing or too short."
            );
          }

          console.log("Firebase project:", serviceAccount.project_id);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const adminUid = "Ld3rzaCvAGNlXBDCofB3mWjgXWp2";

          async function run() {
            const before = await admin.auth().getUser(adminUid);

            console.log("Admin UID:", before.uid);
            console.log("Admin email:", before.email);
            console.log("Admin disabled:", before.disabled);
            console.log("Email verified:", before.emailVerified);
            console.log(
              "Provider IDs:",
              before.providerData.map(p => p.providerId).join(", ")
            );

            await admin.auth().updateUser(adminUid, {
              password: password,
              disabled: false
            });

            const after = await admin.auth().getUser(adminUid);

            console.log("After password update:");
            console.log("Admin UID:", after.uid);
            console.log("Admin email:", after.email);
            console.log("Admin disabled:", after.disabled);
            console.log("Email verified:", after.emailVerified);

            console.log("GREEN: Admin verification and password update completed.");
          }

          run().catch(error => {
            console.error("RED:", error.message);
            process.exit(1);
          });
          NODE
