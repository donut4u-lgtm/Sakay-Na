name: Reset Sakay Na Auth Password

on:
  workflow_dispatch:
    inputs:
      login_email:
        description: "Sakay Na Firebase Auth email"
        required: true
        type: string
      new_password:
        description: "New password"
        required: true
        type: string

jobs:
  reset-password:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Firebase Admin SDK
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Reset Firebase Auth password
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LOGIN_EMAIL: ${{ inputs.login_email }}
          NEW_PASSWORD: ${{ inputs.new_password }}
        run: |
          python - <<'PY'
          import os
          import json
          import firebase_admin
          from firebase_admin import credentials, auth

          service_account = os.environ["FIREBASE_SERVICE_ACCOUNT"]

          try:
              data = json.loads(service_account)
          except Exception:
              raise SystemExit("RED: FIREBASE_SERVICE_ACCOUNT is not valid JSON.")

          project_id = data.get("project_id")

          if project_id != "sakay-na-1cafa":
              raise SystemExit(
                  f"RED: Wrong Firebase project: {project_id}"
              )

          if not firebase_admin._apps:
              cred = credentials.Certificate(data)
              firebase_admin.initialize_app(cred)

          email = os.environ["LOGIN_EMAIL"].strip()
          password = os.environ["NEW_PASSWORD"]

          if not email:
              raise SystemExit("RED: Login email is empty.")

          if len(password) < 6:
              raise SystemExit(
                  "RED: Firebase password must contain at least 6 characters."
              )

          try:
              user = auth.get_user_by_email(email)
          except Exception as e:
              raise SystemExit(
                  f"RED: Firebase Auth user not found: {email}\n{e}"
              )

          updated = auth.update_user(
              user.uid,
              password=password,
              disabled=False
          )

          print("GREEN: Firebase password reset successfully.")
          print(f"Project: {project_id}")
          print(f"Login ID: {updated.email}")
          print(f"UID: {updated.uid}")
          print("Account enabled: YES")
          print("Password: UPDATED")
          PY
