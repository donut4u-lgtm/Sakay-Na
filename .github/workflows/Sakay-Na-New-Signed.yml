name: Test Key and Build Sakay Na Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Green code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RED: SAKAYNA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "RED: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "RED: KEY_ALIAS is missing."
            exit 1
          fi

          echo "Required secrets are present."

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "RED: Keystore file is empty."
            exit 1
          fi

          echo "Keystore restored."

      - name: Verify keystore password and alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Checking keystore..."

          keytool -list \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/tmp/keytool-check.txt 2>&1

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then
            echo "RED: KEYSTORE_PASSWORD or KEY_ALIAS does not match the stored keystore."
            echo "The APK was NOT built."
            exit 1
          fi

          echo "GREEN: Keystore password and alias are correct."

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build signed release APK
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ runner.temp }}/sakayna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SAKAYNA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          if [ ! -s "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "RED: Release APK was not produced."
            exit 1
          fi

          echo "GREEN: Signed APK created successfully."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-New-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
