name: Inspect Sakay Na Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sakayna-release.jks

          echo "Keystore size:"
          wc -c sakayna-release.jks

          echo "Keystore file type:"
          file sakayna-release.jks

      - name: Test common keystore formats
        run: |
          echo "Testing whether the file is a valid Java keystore..."

          keytool -list \
            -keystore sakayna-release.jks \
            -storepass changeit \
            2>&1 || true

          echo "Inspection finished."
