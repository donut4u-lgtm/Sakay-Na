name: Create Signing Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore sakayna-release.jks \
            -alias sakayna \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SakayNa123! \
            -keypass SakayNa123! \
            -dname "CN=Sakay Na, OU=Mobile, O=Sakay Na, L=Philippines, ST=PH, C=PH"

      - name: Encode keystore
        run: |
          base64 -w 0 sakayna-release.jks > sakayna-release.base64
          echo "KEYSTORE_BASE64:"
          cat sakayna-release.base64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: sakayna-keystore
          path: |
            sakayna-release.jks
            sakayna-release.base6
