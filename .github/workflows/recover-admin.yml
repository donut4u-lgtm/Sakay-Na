name: Recover Sakay Na Admin

on:
  workflow_dispatch:

jobs:
  recover-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Firebase Admin SDK
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Recover and VERIFY Admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SAKAYNA_ADMIN_PHONE: ${{ secrets.SAKAYNA_ADMIN_PHONE }}
          SAKAYNA_ADMIN_PASSWORD: ${{ secrets.SAKAYNA_ADMIN_PASSWORD }}
        run: |
          set -e

          test -n "$FIREBASE_SERVICE_ACCOUNT"
          test -n "$SAKAYNA_ADMIN_PHONE"
          test -n "$SAKAYNA_ADMIN_PASSWORD"

          python <<'PY'
          import json
          import os
          import re
          import firebase_admin
          from firebase_admin import credentials, auth, firestore

          PROJECT_ID = "sakay-na-1cafa"
          ADMIN_UID = "Ld3rzaCvAGNlXBDCofB3mWjgXWp2"

          service_account = json.loads(
              os.environ["FIREBASE_SERVICE_ACCOUNT"]
          )

          if service_account.get("project_id") != PROJECT_ID:
              raise RuntimeError("RED: Wrong Firebase project.")

          def normalize_phone(phone):
              digits = re.sub(r"\D", "", phone)

              if digits.startswith("63"):
                  normalized = digits
              elif digits.startswith("09"):
                  normalized = "63" + digits[1:]
              elif digits.startswith("9") and len(digits) == 10:
                  normalized = "63" + digits
              else:
                  raise ValueError("Invalid Philippine phone number")

              if not re.fullmatch(r"63\d{10}", normalized):
                  raise ValueError("Invalid Philippine phone number")

              return normalized

          phone = normalize_phone(
              os.environ["SAKAYNA_ADMIN_PHONE"]
          )

          email = phone + "@sakayna.app"
          password = os.environ["SAKAYNA_ADMIN_PASSWORD"]

          firebase_admin.initialize_app(
              credentials.Certificate(service_account),
              {"projectId": PROJECT_ID}
          )

          db = firestore.client()

          try:
              existing = auth.get_user_by_email(email)

              if existing.uid != ADMIN_UID:
                  raise RuntimeError(
                      "RED: Admin email belongs to another UID."
                  )

              auth.update_user(
                  ADMIN_UID,
                  email=email,
                  password=password,
                  display_name="Sakay Na Admin",
                  disabled=False
              )

          except auth.UserNotFoundError:
              auth.create_user(
                  uid=ADMIN_UID,
                  email=email,
                  password=password,
                  display_name="Sakay Na Admin",
                  disabled=False
              )

          user = auth.get_user(ADMIN_UID)

          if user.uid != ADMIN_UID:
              raise RuntimeError("RED: UID verification failed.")

          if user.email != email:
              raise RuntimeError("RED: Email verification failed.")

          if user.disabled:
              raise RuntimeError("RED: Admin is disabled.")

          db.collection("users").document(ADMIN_UID).set(
              {
                  "uid": ADMIN_UID,
                  "role": "ADMIN",
                  "admin": True,
                  "name": "Sakay Na Admin",
                  "phone": phone,
                  "phoneNumber": phone,
                  "email": email
              },
              merge=True
          )

          doc = (
              db.collection("users")
              .document(ADMIN_UID)
              .get()
          )

          if not doc.exists:
              raise RuntimeError(
                  "RED: Admin Firestore document missing."
              )

          data = doc.to_dict()

          if data.get("role") != "ADMIN":
              raise RuntimeError("RED: Admin role verification failed.")

          if data.get("admin") is not True:
              raise RuntimeError("RED: Admin flag verification failed.")

          print("GREEN: ADMIN RECOVERY VERIFIED")
          print("GREEN: ADMIN ACCOUNT RESTORED AND VERIFIED")
          PY
