name: Verify Original Sakay Na Key

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sakayna-release.jks

      - name: Verify original key
        run: |
          keytool -list \
            -v \
            -keystore sakayna-release.jks \
            -storepass 'SakayNa123!'
