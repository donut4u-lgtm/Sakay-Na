name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Green code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Restore original Sakay Na keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RED: SAKAYNA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "RED: Keystore restore failed."
            exit 1
          fi

          echo "GREEN: Original Sakay Na keystore restored."

      - name: Load original signing password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "RED: SAKAYNA_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore-password"

          echo "GREEN: Original keystore password loaded."

      - name: Verify original Sakay Na signing key
        run: |
          KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/keystore-password")"

          keytool -list \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias sakayna

          echo "GREEN: Original signing alias sakayna verified."

      - name: Configure Gradle signing
        run: |
          KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/keystore-password")"

          echo "SAKAYNA_KEYSTORE_PATH=$RUNNER_TEMP/sakayna-release.jks" >> "$GITHUB_ENV"
          echo "SAKAYNA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SAKAYNA_KEY_ALIAS=sakayna" >> "$GITHUB_ENV"

          echo "GREEN: Gradle signing configured."
          echo "GREEN: Signing alias: sakayna"

      - name: Build signed release APK
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          if [ -z "$TOMTOM_API_KEY" ]; then
            echo "RED: Missing TOMTOM_API_KEY GitHub secret."
            exit 1
          fi

          echo "GREEN: TomTom API key is available."

          gradle :app:assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "RED: Release APK was not produced."
            exit 1
          fi

          echo "GREEN: Signed Sakay Na APK created."

      - name: Verify APK certificate
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "RED: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "GREEN: APK certificate verification completed."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-fixed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: GREEN
        run: |
          echo "========================================"
          echo "GREEN: SAKAY NA APK READY"
          echo "========================================"
