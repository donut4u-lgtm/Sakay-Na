name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Verify project
        run: |
          echo "===== BRANCH ====="
          git branch --show-current
          echo "===== COMMIT ====="
          git rev-parse HEAD
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== SETTINGS ====="
          cat settings.gradle.kts
          echo "===== APP ====="
          ls -la app
          echo "===== GRADLE WRAPPER ====="
          ls -la gradle
          ls -la gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-debug
          path: app/build/outputs/apk/debug/app-debug.apk
