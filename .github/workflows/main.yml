name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Restore Sakay Na release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RED: SAKAYNA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "RED: Existing release keystore could not be restored."
            exit 1
          fi

          echo "GREEN: Existing release keystore restored."

      - name: Detect original keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "RED: SAKAYNA_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          ALIAS=$(keytool -list \
            -v \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            2>/dev/null \
            | awk -F': ' '/Alias name:/ {print $2; exit}')

          if [ -z "$ALIAS" ]; then
            echo "RED: Could not detect the original keystore alias."
            exit 1
          fi

          echo "GREEN: Original keystore alias detected."
          echo "SAKAYNA_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ runner.temp }}/sakayna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SAKAYNA_KEYSTORE_PASSWORD" ]; then
            echo "RED: SAKAYNA_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "RED: Release APK was not produced."
            exit 1
          fi

          echo "GREEN: Sakay Na release APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-fixed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
