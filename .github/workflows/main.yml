name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

            - name: Verify project
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== ROOT FILES ====="
          ls -lab
          echo "===== FIND SETTINGS ====="
          find . -maxdepth 3 -type f -name 'settings.gradle.kts' -print
        
          
          
          
          
          
        
        
          echo "===== APP ====="
          ls -la app
          echo "===== GRADLE WRAPPER ====="
          ls -la gradle
          ls -la gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-debug
          path: app/build/outputs/apk/debug/app-debug.apk
