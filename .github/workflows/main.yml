name: Build Sakay Na APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/sakyna/app
          mkdir -p app/src/main/res

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Sakay-Na"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sakyna.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sakyna.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Sakay Na"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/sakyna/app/MainActivity.java <<'EOF'
          package com.sakyna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int GREEN = Color.rgb(20, 110, 60);
              private static final int BLUE = Color.rgb(35, 95, 170);
              private static final int RED = Color.rgb(170, 60, 50);

              private EditText pickupInput;
              private EditText destinationInput;
              private TextView fareText;

              private static boolean rideRequested = false;
              private static boolean rideAccepted = false;

              private static String requestedPickup = "";
              private static String requestedDestination = "";
              private static int requestedFare = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private LinearLayout baseScreen() {
                  LinearLayout screen = new LinearLayout(this);
                  screen.setOrientation(LinearLayout.VERTICAL);
                  screen.setPadding(25, 30, 25, 25);
                  screen.setBackgroundColor(Color.WHITE);
                  return screen;
              }

              private void showScreen(LinearLayout screen) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.addView(screen);
                  setContentView(scroll);
              }

              private TextView label(
                      String text,
                      float size,
                      int color,
                      boolean bold) {

                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  view.setGravity(Gravity.CENTER);

                  if (bold) {
                      view.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  }

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  params.setMargins(0, 8, 0, 8);
                  view.setLayoutParams(params);

                  return view;
              }

              private Button menuButton(String text, int color) {

                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(17);
                  button.setTextColor(Color.WHITE);
                  button.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(color);
                  background.setCornerRadius(24);
                  button.setBackground(background);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  65);

                  params.setMargins(0, 8, 0, 8);
                  button.setLayoutParams(params);

                  return button;
              }

              private EditText input(String hint) {

                  EditText editText = new EditText(this);
                  editText.setHint(hint);
                  editText.setTextSize(17);
                  editText.setSingleLine(true);
                  editText.setPadding(20, 10, 20, 10);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(Color.rgb(245, 245, 245));
                  background.setCornerRadius(18);
                  background.setStroke(1, Color.LTGRAY);

                  editText.setBackground(background);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  60);

                  params.setMargins(0, 5, 0, 15);
                  editText.setLayoutParams(params);

                  return editText;
              }

              private void showHome() {

                  LinearLayout screen = baseScreen();
                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(label("🛺", 55, Color.BLACK, false));

                  screen.addView(
                          label(
                                  "Sakay Na",
                                  36,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "Your local ride, made easy",
                                  17,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "Choose your mode",
                                  20,
                                  Color.BLACK,
                                  true));

                  Button passenger =
                          menuButton("PASSENGER", GREEN);

                  Button driver =
                          menuButton("DRIVER", BLUE);

                  Button admin =
                          menuButton("ADMIN", RED);

                  passenger.setOnClickListener(v -> showPassenger());
                  driver.setOnClickListener(v -> showDriver());
                  admin.setOnClickListener(v -> showAdmin());

                  screen.addView(passenger);
                  screen.addView(driver);
                  screen.addView(admin);

                  showScreen(screen);
              }

              private void showPassenger() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "BOOK A RIDE",
                                  28,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "Tell us where you're going.",
                                  17,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "PICKUP LOCATION",
                                  15,
                                  Color.BLACK,
                                  true));

                  pickupInput =
                          input("Example: Sariaya Public Market");

                  screen.addView(pickupInput);

                  screen.addView(
                          label(
                                  "DESTINATION",
                                  15,
                                  Color.BLACK,
                                  true));

                  destinationInput =
                          input("Example: Sariaya Municipal Hall");

                  screen.addView(destinationInput);

                  screen.addView(
                          label(
                                  "RIDE TYPE",
                                  15,
                                  Color.BLACK,
                                  true));

                  screen.addView(
                          label(
                                  "🛺  Tricycle",
                                  18,
                                  GREEN,
                                  true));

                  fareText =
                          label(
                                  "Estimated fare: ₱0",
                                  20,
                                  GREEN,
                                  true);

                  screen.addView(fareText);

                  Button calculate =
                          menuButton(
                                  "CALCULATE FARE",
                                  GREEN);

                  calculate.setOnClickListener(
                          v -> calculateFare());

                  Button request =
                          menuButton(
                                  "REQUEST RIDE",
                                  GREEN);

                  request.setOnClickListener(
                          v -> requestRide());

                  Button status =
                          menuButton(
                                  "CHECK RIDE STATUS",
                                  BLUE);

                  status.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back =
                          menuButton(
                                  "BACK",
                                  Color.GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(calculate);
                  screen.addView(request);
                  screen.addView(status);
                  screen.addView(back);

                  showScreen(screen);
              }

              private void calculateFare() {

                  String pickup =
                          pickupInput.getText().toString().trim();

                  String destination =
                          destinationInput.getText().toString().trim();

                  if (pickup.isEmpty() ||
                          destination.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please enter pickup and destination.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  requestedFare = 50;

                  fareText.setText(
                          "Estimated fare: ₱" +
                          requestedFare);
              }

              private void requestRide() {

                  String pickup =
                          pickupInput.getText().toString().trim();

                  String destination =
                          destinationInput.getText().toString().trim();

                  if (pickup.isEmpty() ||
                          destination.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please enter pickup and destination.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  requestedPickup = pickup;
                  requestedDestination = destination;

                  if (requestedFare == 0) {
                      requestedFare = 50;
                  }

                  rideRequested = true;
                  rideAccepted = false;

                  showRideRequested();
              }

              private void showRideRequested() {

                  LinearLayout screen = baseScreen();

                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(
                          label(
                                  "RIDE REQUESTED",
                                  28,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "🛺",
                                  55,
                                  Color.BLACK,
                                  false));

                  screen.addView(
                          label(
                                  "Looking for an available driver...",
                                  19,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "Pickup:\n" +
                                  requestedPickup +
                                  "\n\nDestination:\n" +
                                  requestedDestination +
                                  "\n\nFare: ₱" +
                                  requestedFare,
                                  18,
                                  Color.DKGRAY,
                                  false));

                  Button status =
                          menuButton(
                                  "CHECK RIDE STATUS",
                                  BLUE);

                  status.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  Color.GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(status);
                  screen.addView(back);

                  showScreen(screen);
              }

              private void showPassengerStatus() {

                  LinearLayout screen = baseScreen();

                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(
                          label(
                                  "RIDE STATUS",
                                  28,
                                  GREEN,
                                  true));

                  if (!rideRequested) {

                      screen.addView(
                              label(
                                      "No active ride.\n\nBook a ride first.",
                                      19,
                                      Color.DKGRAY,
                                      false));

                  } else if (!rideAccepted) {

                      screen.addView(
                              label(
                                      "🟡 DRIVER SEARCHING\n\n" +
                                      "Your ride request is waiting for a driver.",
                                      19,
                                      Color.DKGRAY,
                                      false));

                  } else {

                      screen.addView(
                              label(
                                      "🟢 DRIVER ACCEPTED\n\n" +
                                      "Your driver has accepted the ride!\n\n" +
                                      "Pickup:\n" +
                                      requestedPickup +
                                      "\n\nDestination:\n" +
                                      requestedDestination +
                                      "\n\nFare: ₱" +
                                      requestedFare,
                                      19,
                                      Color.DKGRAY,
                                      false));
                  }

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  Color.GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showDriver() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "DRIVER",
                                  30,
                                  BLUE,
                                  true));

                  if (!rideRequested) {

                      screen.addView(
                              label(
                                      "No passenger ride requests yet.",
                                      19,
                                      Color.DKGRAY,
                                      false));

                  } else {

                      screen.addView(
                              label(
                                      "NEW RIDE REQUEST",
                                      22,
                                      BLUE,
                                      true));

                      screen.addView(
                              label(
                                      "Pickup:\n" +
                                      requestedPickup +
                                      "\n\nDestination:\n" +
                                      requestedDestination +
                                      "\n\nFare: ₱" +
                                      requestedFare,
                                      19,
                                      Color.DKGRAY,
                                      false));

                      if (rideAccepted) {

                          screen.addView(
                                  label(
                                          "🟢 RIDE ACCEPTED",
                                          21,
                                          GREEN,
                                          true));

                      } else {

                          Button accept =
                                  menuButton(
                                          "ACCEPT RIDE",
                                          GREEN);

                          accept.setOnClickListener(
                                  v -> {

                                      rideAccepted = true;

                                      Toast.makeText(
                                              this,
                                              "Ride accepted!",
                                              Toast.LENGTH_SHORT).show();

                                      showDriver();
                                  });

                          screen.addView(accept);
                      }
                  }

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  Color.GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showAdmin() {

                  LinearLayout screen = baseScreen();

                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(
                          label(
                                  "ADMIN",
                                  30,
                                  RED,
                                  true));

                  screen.addView(
                          label(
                                  "Sakay Na Administration\n\n" +
                                  "System status: ONLINE\n\n" +
                                  "Passenger request: " +
                                  (rideRequested ? "YES" : "NO") +
                                  "\nDriver accepted: " +
                                  (rideAccepted ? "YES" : "NO"),
                                  19,
                                  Color.DKGRAY,
                                  false));

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  Color.GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakayNa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
