name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Green code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Load signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_1: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD_2: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
          KEY_ALIAS_1: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_2: ${{ secrets.SAKAYNA_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RED: SAKAYNA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD_1"

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD_2"
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "RED: No keystore password secret was found."
            echo "Checked KEYSTORE_PASSWORD and SAKAYNA_KEYSTORE_PASSWORD."
            exit 1
          fi

          KEY_ALIAS="$KEY_ALIAS_1"

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS="$KEY_ALIAS_2"
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "RED: No keystore alias secret was found."
            echo "Checked KEY_ALIAS and SAKAYNA_KEY_ALIAS."
            exit 1
          fi

          echo "GREEN: Required signing secrets found."

          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore-password"
          printf '%s' "$KEY_ALIAS" > "$RUNNER_TEMP/key-alias"

      - name: Restore original Sakay Na keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "RED: Keystore restore failed."
            exit 1
          fi

          echo "GREEN: Original Sakay Na keystore restored."

      - name: Verify original keystore
        run: |
          KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/keystore-password")"
          KEY_ALIAS="$(cat "$RUNNER_TEMP/key-alias")"

          if keytool -list \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/keytool-check.txt" 2>&1
          then
            echo "GREEN: Original keystore password and alias verified."
          else
            echo "RED: Keystore password or alias does not match."
            cat "$RUNNER_TEMP/keytool-check.txt"
            exit 1
          fi

      - name: Configure Gradle signing
        run: |
          echo "SAKAYNA_KEYSTORE_PATH=$RUNNER_TEMP/sakayna-release.jks" >> "$GITHUB_ENV"
          echo "SAKAYNA_KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/keystore-password")" >> "$GITHUB_ENV"
          echo "SAKAYNA_KEY_ALIAS=$(cat "$RUNNER_TEMP/key-alias")" >> "$GITHUB_ENV"

          echo "GREEN: Gradle signing environment configured."

      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "RED: Release APK was not produced."
            exit 1
          fi

          echo "GREEN: Signed Sakay Na APK created."

      - name: Verify APK certificate
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "GREEN: APK certificate verification completed."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-fixed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: GREEN
        run: |
          echo "========================================"
          echo "GREEN: SAKAY NA APK READY"
          echo "========================================"
