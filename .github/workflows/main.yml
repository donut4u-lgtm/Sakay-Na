name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sakay Na
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "CURRENT DIRECTORY:"
          pwd
          echo ""
          echo "FILES:"
          ls -la
          echo ""
          echo "APP DIRECTORY:"
          ls -la app || true
          echo ""
          echo "SETTINGS:"
          cat settings.gradle.kts || true
          echo ""
          echo "APP BUILD FILE:"
          cat app/build.gradle.kts || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Show Gradle projects
        run: |
          gradle projects

      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-debug
          path: app/build/outputs/apk/debug/app-debug.apk
