name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          CLEAN_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/sakyna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakyna-release.jks" ]; then
            echo "ERROR: Signing keystore was not created."
            exit 1
          fi

          echo "Signing keystore prepared successfully."

      - name: Build release APK
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ runner.temp }}/sakyna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.SAKAYNA_KEYSTORE_PASSWORD }}
          SAKAYNA_KEY_ALIAS: ${{ secrets.SAKAYNA_KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release
          path: app/build/outputs/apk/release/app-release.apk
