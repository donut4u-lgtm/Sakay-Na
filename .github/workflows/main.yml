name: Build Sakay Na APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project folders
        run: |
          mkdir -p app/src/main/java/com/sakyna/app
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Sakay-Na"
          include(":app")
          EOF

      - name: Create root build.gradle.kts
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

      - name: Create app build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sakyna.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sakyna.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Sakay Na"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/sakyna/app/MainActivity.java <<'EOF'
          package com.sakyna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static String registeredName = "";
              private static String registeredMobile = "";
              private static String registeredPassword = "";
              private static String registeredRole = "";

              private static String loggedInName = "";
              private static String loggedInRole = "";

              /*
               * Ride status:
               * 0 = No ride
               * 1 = Searching
               * 2 = Accepted
               * 3 = Driver on the way
               * 4 = Driver arrived
               * 5 = In trip
               * 6 = Completed
               */
              private static int rideStatus = 0;

              private static boolean rideRequested = false;
              private static String requestedPickup = "";
              private static String requestedDestination = "";
              private static int requestedFare = 0;

              private LinearLayout content;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private void setupScreen(String title) {
                  ScrollView scrollView = new ScrollView(this);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(32, 32, 32, 32);

                  scrollView.addView(content);
                  setContentView(scrollView);

                  TextView titleView = new TextView(this);
                  titleView.setText(title);
                  titleView.setTextSize(28);
                  titleView.setTextColor(Color.BLACK);
                  titleView.setGravity(Gravity.CENTER);
                  titleView.setPadding(0, 10, 0, 30);

                  content.addView(titleView);
              }

              private TextView text(String value, int size) {
                  TextView tv = new TextView(this);
                  tv.setText(value);
                  tv.setTextSize(size);
                  tv.setTextColor(Color.DKGRAY);
                  tv.setPadding(0, 10, 0, 10);
                  return tv;
              }

              private EditText input(String hint) {
                  EditText edit = new EditText(this);
                  edit.setHint(hint);
                  edit.setTextSize(18);
                  edit.setSingleLine(true);
                  edit.setPadding(20, 15, 20, 15);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  params.setMargins(0, 8, 0, 8);
                  edit.setLayoutParams(params);

                  content.addView(edit);
                  return edit;
              }

              private EditText passwordInput(String hint) {
                  EditText edit = input(hint);
                  edit.setInputType(
                          InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  return edit;
              }

              private Button button(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(17);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  params.setMargins(0, 8, 0, 8);
                  b.setLayoutParams(params);

                  content.addView(b);
                  return b;
              }

              private boolean validMobile(String mobile) {
                  return mobile != null
                          && mobile.matches("09[0-9]{9}");
              }

              private void showHome() {
                  setupScreen("🛺 Sakay Na");

                  content.addView(text(
                          "Tricycle ride-hailing app",
                          18));

                  if (!loggedInName.isEmpty()) {
                      content.addView(text(
                              "Logged in as: " + loggedInName +
                              "\nRole: " + loggedInRole +
                              "\nMobile: " + registeredMobile,
                              17));
                  }

                  Button login = button("LOGIN");
                  login.setOnClickListener(v -> showLogin());

                  Button register = button("REGISTER");
                  register.setOnClickListener(v -> showRegister());

                  Button passenger = button("PASSENGER");
                  passenger.setOnClickListener(v -> checkRoleAndPassenger());

                  Button driver = button("DRIVER");
                  driver.setOnClickListener(v -> checkRoleAndDriver());

                  Button admin = button("ADMIN");
                  admin.setOnClickListener(v -> checkRoleAndAdmin());

                  if (!loggedInName.isEmpty()) {
                      Button logout = button("LOGOUT");
                      logout.setOnClickListener(v -> {
                          loggedInName = "";
                          loggedInRole = "";
                          Toast.makeText(
                                  this,
                                  "Logged out",
                                  Toast.LENGTH_SHORT
                          ).show();
                          showHome();
                      });
                  }
              }

              private void showRegister() {
                  setupScreen("Create Account");

                  content.addView(text(
                          "Choose your account type:",
                          19));

                  Button passenger = button("REGISTER AS PASSENGER");
                  passenger.setOnClickListener(
                          v -> showRegistrationForm("Passenger"));

                  Button driver = button("REGISTER AS DRIVER");
                  driver.setOnClickListener(
                          v -> showRegistrationForm("Driver"));

                  Button admin = button("REGISTER AS ADMIN");
                  admin.setOnClickListener(
                          v -> showRegistrationForm("Admin"));

                  Button back = button("BACK");
                  back.setOnClickListener(v -> showHome());
              }

              private void showRegistrationForm(String role) {
                  setupScreen("Register - " + role);

                  content.addView(text(
                          "Account type: " + role,
                          18));

                  EditText name = input("Full name");

                  EditText mobile = input("Mobile number (09XXXXXXXXX)");
                  mobile.setInputType(InputType.TYPE_CLASS_PHONE);

                  EditText password =
                          passwordInput("Password");

                  Button register = button("CREATE ACCOUNT");

                  register.setOnClickListener(v -> {

                      String nameValue =
                              name.getText().toString().trim();

                      String mobileValue =
                              mobile.getText().toString().trim();

                      String passwordValue =
                              password.getText().toString();

                      if (nameValue.isEmpty()) {
                          Toast.makeText(
                                  this,
                                  "Please enter your full name",
                                  Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      if (!validMobile(mobileValue)) {
                          Toast.makeText(
                                  this,
                                  "Enter a valid Philippine mobile number: 09XXXXXXXXX",
                                  Toast.LENGTH_LONG
                          ).show();
                          return;
                      }

                      if (passwordValue.length() < 4) {
                          Toast.makeText(
                                  this,
                                  "Password must be at least 4 characters",
                                  Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      registeredName = nameValue;
                      registeredMobile = mobileValue;
                      registeredPassword = passwordValue;
                      registeredRole = role;

                      Toast.makeText(
                              this,
                              "Account created successfully",
                              Toast.LENGTH_SHORT
                      ).show();

                      showLogin();
                  });

                  Button back = button("BACK");
                  back.setOnClickListener(v -> showRegister());
              }

              private void showLogin() {
                  setupScreen("Login");

                  content.addView(text(
                          "Login using your mobile number",
                          18));

                  EditText mobile =
                          input("Mobile number (09XXXXXXXXX)");
                  mobile.setInputType(InputType.TYPE_CLASS_PHONE);

                  EditText password =
                          passwordInput("Password");

                  Button login = button("LOGIN");

                  login.setOnClickListener(v -> {

                      String mobileValue =
                              mobile.getText().toString().trim();

                      String passwordValue =
                              password.getText().toString();

                      if (registeredMobile.isEmpty()) {
                          Toast.makeText(
                                  this,
                                  "No account registered yet",
                                  Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      if (!mobileValue.equals(registeredMobile)
                              || !passwordValue.equals(registeredPassword)) {

                          Toast.makeText(
                                  this,
                                  "Incorrect mobile number or password",
                                  Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      loggedInName = registeredName;
                      loggedInRole = registeredRole;

                      Toast.makeText(
                              this,
                              "Login successful",
                              Toast.LENGTH_SHORT
                      ).show();

                      showHome();
                  });

                  Button back = button("BACK");
                  back.setOnClickListener(v -> showHome());
              }

              private void checkRoleAndPassenger() {
                  if (loggedInName.isEmpty()) {
                      Toast.makeText(
                              this,
                              "Please login first",
                              Toast.LENGTH_SHORT
                      ).show();
                      showLogin();
                      return;
                  }

                  if (!loggedInRole.equals("Passenger")) {
                      Toast.makeText(
                              this,
                              "Passenger account required",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  showPassenger();
              }

              private void checkRoleAndDriver() {
                  if (loggedInName.isEmpty()) {
                      Toast.makeText(
                              this,
                              "Please login first",
                              Toast.LENGTH_SHORT
                      ).show();
                      showLogin();
                      return;
                  }

                  if (!loggedInRole.equals("Driver")) {
                      Toast.makeText(
                              this,
                              "Driver account required",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  showDriver();
              }

              private void checkRoleAndAdmin() {
                  if (loggedInName.isEmpty()) {
                      Toast.makeText(
                              this,
                              "Please login first",
                              Toast.LENGTH_SHORT
                      ).show();
                      showLogin();
                      return;
                  }

                  if (!loggedInRole.equals("Admin")) {
                      Toast.makeText(
                              this,
                              "Admin account required",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  showAdmin();
              }

              private void showPassenger() {
                  setupScreen("Passenger");

                  content.addView(text(
                          "Welcome, " + loggedInName,
                          20));

                  EditText pickup =
                          input("Pickup location");

                  EditText destination =
                          input("Destination");

                  Button fare = button("CALCULATE FARE");

                  TextView fareText = text(
                          "Estimated fare: ₱0",
                          19);

                  content.addView(fareText);

                  fare.setOnClickListener(v -> {

                      String p =
                              pickup.getText().toString().trim();

                      String d =
                              destination.getText().toString().trim();

                      if (p.isEmpty() || d.isEmpty()) {
                          Toast.makeText(
                                  this,
                                  "Enter pickup and destination",
                                  Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      requestedPickup = p;
                      requestedDestination = d;
                      requestedFare = 50;

                      fareText.setText(
                              "Estimated fare: ₱" + requestedFare);
                  });

                  Button request = button("REQUEST RIDE");

                  request.setOnClickListener(v -> {

                      String p =
                              pickup.getText().toString().trim();

                      String d =
                              destination.getText().toString().trim();

                      if (p.isEmpty() || d.isEmpty()) {
                          Toast.makeText(
                                  this,
                                  "Enter pickup and destination",
                                  Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      requestedPickup = p;
                      requestedDestination = d;

                      if (requestedFare == 0) {
                          requestedFare = 50;
                      }

                      rideRequested = true;
                      rideStatus = 1;

                      Toast.makeText(
                              this,
                              "Ride requested",
                              Toast.LENGTH_SHORT
                      ).show();

                      showPassenger();
                  });

                  Button status = button("CHECK RIDE STATUS");

                  status.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back = button("BACK HOME");
                  back.setOnClickListener(v -> showHome());
              }

              private void showPassengerStatus() {
                  setupScreen("Ride Status");

                  if (!rideRequested) {
                      content.addView(text(
                              "No active ride.",
                              20));
                  } else {

                      content.addView(text(
                              "Pickup:\n" + requestedPickup,
                              18));

                      content.addView(text(
                              "Destination:\n" +
                              requestedDestination,
                              18));

                      content.addView(text(
                              "Fare: ₱" + requestedFare,
                              18));

                      content.addView(text(
                              "Status:\n" + statusText(),
                              24));
                  }

                  Button refresh = button("REFRESH STATUS");
                  refresh.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back = button("BACK TO PASSENGER");
                  back.setOnClickListener(v -> showPassenger());
              }

              private String statusText() {
                  switch (rideStatus) {
                      case 1:
                          return "Searching for a driver";
                      case 2:
                          return "Driver accepted your ride";
                      case 3:
                          return "Driver is on the way";
                      case 4:
                          return "Driver has arrived";
                      case 5:
                          return "Trip in progress";
                      case 6:
                          return "Trip completed";
                      default:
                          return "No active ride";
                  }
              }

              private String driverButtonText() {
                  switch (rideStatus) {
                      case 1:
                          return "ACCEPT RIDE";
                      case 2:
                          return "START DRIVING TO PASSENGER";
                      case 3:
                          return "MARK AS ARRIVED";
                      case 4:
                          return "START TRIP";
                      case 5:
                          return "COMPLETE TRIP";
                      default:
                          return "NO ACTION";
                  }
              }

              private void advanceRide() {
                  if (rideStatus < 6) {
                      rideStatus++;
                  }
              }

              private void showDriver() {
                  setupScreen("Driver");

                  content.addView(text(
                          "Welcome, " + loggedInName,
                          20));

                  if (!rideRequested) {

                      content.addView(text(
                              "No ride requests available.",
                              20));

                  } else {

                      content.addView(text(
                              "Passenger ride request",
                              22));

                      content.addView(text(
                              "Pickup:\n" + requestedPickup,
                              18));

                      content.addView(text(
                              "Destination:\n" +
                              requestedDestination,
                              18));

                      content.addView(text(
                              "Fare: ₱" + requestedFare,
                              18));

                      content.addView(text(
                              "Current status:\n" +
                              statusText(),
                              20));

                      if (rideStatus >= 1 && rideStatus < 6) {

                          Button action =
                                  button(driverButtonText());

                          action.setOnClickListener(v -> {
                              advanceRide();

                              Toast.makeText(
                                      this,
                                      statusText(),
                                      Toast.LENGTH_SHORT
                              ).show();

                              showDriver();
                          });
                      }
                  }

                  Button back = button("BACK HOME");
                  back.setOnClickListener(v -> showHome());
              }

              private void showAdmin() {
                  setupScreen("Admin");

                  content.addView(text(
                          "Welcome, " + loggedInName,
                          20));

                  content.addView(text(
                          "Admin Dashboard",
                          24));

                  content.addView(text(
                          "Registered account:\n" +
                          registeredName +
                          "\nMobile: " +
                          registeredMobile +
                          "\nRole: " +
                          registeredRole,
                          18));

                  content.addView(text(
                          "Ride status:\n" +
                          statusText(),
                          20));

                  Button resetRide =
                          button("RESET CURRENT RIDE");

                  resetRide.setOnClickListener(v -> {
                      rideRequested = false;
                      requestedPickup = "";
                      requestedDestination = "";
                      requestedFare = 0;
                      rideStatus = 0;

                      Toast.makeText(
                              this,
                              "Ride reset",
                              Toast.LENGTH_SHORT
                      ).show();

                      showAdmin();
                  });

                  Button back = button("BACK HOME");
                  back.setOnClickListener(v -> showHome());
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          export GRADLE_HOME="$PWD/gradle-8.10.2"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version

      - name: Build APK
        run: |
          export GRADLE_HOME="$PWD/gradle-8.10.2"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-debug
          path: app/build/outputs/apk/debug/app-debug.apk
