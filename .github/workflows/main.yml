name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check files
        run: |
          pwd
          ls -la
          echo "SETTINGS:"
          ls -l settings.gradle.kts
          echo "APP:"
          ls -la app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-debug
          path: app/build/outputs/apk/debug/app-debug.apk
