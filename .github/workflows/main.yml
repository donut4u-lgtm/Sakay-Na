name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Green code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RED: SAKAYNA_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "RED: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "RED: KEY_ALIAS secret is missing."
            exit 1
          fi

          echo "GREEN: Required signing secrets are present."

      - name: Restore original Sakay Na release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakayna-release.jks"

          if [ ! -s "$RUNNER_TEMP/sakayna-release.jks" ]; then
            echo "RED: Existing release keystore could not be restored."
            exit 1
          fi

          echo "GREEN: Original release keystore restored."

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Checking original Sakay Na signing key..."

          if keytool -list \
            -keystore "$RUNNER_TEMP/sakayna-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/keytool-check.txt" 2>&1
          then
            echo "GREEN: Original keystore password and alias verified."
          else
            echo "RED: Keystore password or alias does not match."
            echo "The APK was NOT built."
            cat "$RUNNER_TEMP/keytool-check.txt"
            exit 1
          fi

      - name: Configure signing environment
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "SAKAYNA_KEYSTORE_PATH=$RUNNER_TEMP/sakayna-release.jks" >> "$GITHUB_ENV"
          echo "SAKAYNA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SAKAYNA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          echo "GREEN: Sakay Na signing environment configured."

      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify signed APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "RED: Release APK was not produced."
            exit 1
          fi

          echo "GREEN: Sakay Na release APK created."

      - name: Verify APK certificate
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -x "$APKSIGNER" ]; then
            echo "RED: apksigner was not found."
            exit 1
          fi

          echo "Checking final APK certificate..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "GREEN: APK signature verification completed."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-fixed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: GREEN build result
        run: |
          echo "========================================"
          echo "GREEN: SAKAY NA SIGNED APK READY"
          echo "========================================"
