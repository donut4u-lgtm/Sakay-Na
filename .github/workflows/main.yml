name: Build Sakay Na APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/sakyna/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Sakay-Na"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sakyna.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sakyna.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Sakay Na"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/sakyna/app/MainActivity.java <<'EOF'
          package com.sakyna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int GREEN = Color.rgb(20, 110, 60);
              private static final int BLUE = Color.rgb(35, 95, 170);
              private static final int RED = Color.rgb(170, 60, 50);
              private static final int GRAY = Color.GRAY;

              private EditText pickupInput;
              private EditText destinationInput;
              private TextView fareText;

              private EditText nameInput;
              private EditText emailInput;
              private EditText passwordInput;

              private static String registeredName = "";
              private static String registeredEmail = "";
              private static String registeredPassword = "";
              private static String registeredRole = "";

              private static String loggedInName = "";
              private static String loggedInRole = "";

              private static boolean rideRequested = false;

              private static String requestedPickup = "";
              private static String requestedDestination = "";
              private static int requestedFare = 0;

              /*
               * 0 = No ride
               * 1 = Searching
               * 2 = Accepted
               * 3 = Driver on the way
               * 4 = Driver arrived
               * 5 = In trip
               * 6 = Completed
               */

              private static int rideStatus = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private LinearLayout baseScreen() {
                  LinearLayout screen = new LinearLayout(this);
                  screen.setOrientation(LinearLayout.VERTICAL);
                  screen.setPadding(25, 30, 25, 30);
                  screen.setBackgroundColor(Color.WHITE);
                  return screen;
              }

              private void showScreen(LinearLayout screen) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.addView(screen);
                  setContentView(scroll);
              }

              private TextView label(
                      String text,
                      float size,
                      int color,
                      boolean bold) {

                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  view.setGravity(Gravity.CENTER);

                  if (bold) {
                      view.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  }

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  p.setMargins(0, 10, 0, 10);
                  view.setLayoutParams(p);

                  return view;
              }

              private Button menuButton(String text, int color) {

                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(17);
                  button.setTextColor(Color.WHITE);
                  button.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(color);
                  bg.setCornerRadius(24);
                  button.setBackground(bg);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  70);

                  p.setMargins(0, 10, 0, 10);
                  button.setLayoutParams(p);

                  return button;
              }

              private EditText input(String hint) {

                  EditText edit = new EditText(this);
                  edit.setHint(hint);
                  edit.setTextSize(17);
                  edit.setSingleLine(true);
                  edit.setPadding(20, 10, 20, 10);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.rgb(245, 245, 245));
                  bg.setCornerRadius(18);
                  bg.setStroke(1, Color.LTGRAY);

                  edit.setBackground(bg);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  65);

                  p.setMargins(0, 5, 0, 15);
                  edit.setLayoutParams(p);

                  return edit;
              }

              private void showHome() {

                  LinearLayout screen = baseScreen();
                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(label("🛺", 55, Color.BLACK, false));

                  screen.addView(
                          label("Sakay Na", 36, GREEN, true));

                  screen.addView(
                          label(
                                  "Your local ride, made easy",
                                  17,
                                  Color.DKGRAY,
                                  false));

                  if (!loggedInRole.isEmpty()) {

                      screen.addView(
                              label(
                                      "Logged in as: " +
                                              loggedInName +
                                              "\nRole: " +
                                              loggedInRole,
                                      17,
                                      GREEN,
                                      true));
                  }

                  Button login =
                          menuButton("LOGIN", BLUE);

                  Button register =
                          menuButton("REGISTER", GREEN);

                  Button passenger =
                          menuButton("PASSENGER", GREEN);

                  Button driver =
                          menuButton("DRIVER", BLUE);

                  Button admin =
                          menuButton("ADMIN", RED);

                  login.setOnClickListener(
                          v -> showLogin());

                  register.setOnClickListener(
                          v -> showRegister());

                  passenger.setOnClickListener(
                          v -> checkRoleAndPassenger());

                  driver.setOnClickListener(
                          v -> checkRoleAndDriver());

                  admin.setOnClickListener(
                          v -> checkRoleAndAdmin());

                  screen.addView(login);
                  screen.addView(register);
                  screen.addView(passenger);
                  screen.addView(driver);
                  screen.addView(admin);

                  if (!loggedInRole.isEmpty()) {

                      Button logout =
                              menuButton("LOGOUT", GRAY);

                      logout.setOnClickListener(
                              v -> {
                                  loggedInName = "";
                                  loggedInRole = "";
                                  Toast.makeText(
                                          this,
                                          "Logged out.",
                                          Toast.LENGTH_SHORT).show();
                                  showHome();
                              });

                      screen.addView(logout);
                  }

                  showScreen(screen);
              }

              private void showRegister() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "CREATE ACCOUNT",
                                  28,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "Choose your account type.",
                                  17,
                                  Color.DKGRAY,
                                  false));

                  Button passenger =
                          menuButton(
                                  "REGISTER AS PASSENGER",
                                  GREEN);

                  Button driver =
                          menuButton(
                                  "REGISTER AS DRIVER",
                                  BLUE);

                  Button admin =
                          menuButton(
                                  "REGISTER AS ADMIN",
                                  RED);

                  passenger.setOnClickListener(
                          v -> showRegistrationForm("Passenger"));

                  driver.setOnClickListener(
                          v -> showRegistrationForm("Driver"));

                  admin.setOnClickListener(
                          v -> showRegistrationForm("Admin"));

                  screen.addView(passenger);
                  screen.addView(driver);
                  screen.addView(admin);

                  Button back =
                          menuButton("BACK", GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showRegistrationForm(String role) {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "REGISTER",
                                  28,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "Account type: " + role,
                                  19,
                                  Color.DKGRAY,
                                  true));

                  screen.addView(
                          label(
                                  "FULL NAME",
                                  15,
                                  Color.BLACK,
                                  true));

                  nameInput =
                          input("Enter your name");

                  screen.addView(nameInput);

                  screen.addView(
                          label(
                                  "EMAIL",
                                  15,
                                  Color.BLACK,
                                  true));

                  emailInput =
                          input("Enter email");

                  screen.addView(emailInput);

                  screen.addView(
                          label(
                                  "PASSWORD",
                                  15,
                                  Color.BLACK,
                                  true));

                  passwordInput =
                          input("Create password");

                  passwordInput.setInputType(
                          0x00000081);

                  screen.addView(passwordInput);

                  Button create =
                          menuButton(
                                  "CREATE ACCOUNT",
                                  GREEN);

                  create.setOnClickListener(
                          v -> {

                              String name =
                                      nameInput.getText()
                                              .toString()
                                              .trim();

                              String email =
                                      emailInput.getText()
                                              .toString()
                                              .trim();

                              String password =
                                      passwordInput.getText()
                                              .toString()
                                              .trim();

                              if (name.isEmpty() ||
                                      email.isEmpty() ||
                                      password.isEmpty()) {

                                  Toast.makeText(
                                          this,
                                          "Please complete all fields.",
                                          Toast.LENGTH_SHORT).show();

                                  return;
                              }

                              registeredName = name;
                              registeredEmail = email;
                              registeredPassword = password;
                              registeredRole = role;

                              Toast.makeText(
                                      this,
                                      "Account created!",
                                      Toast.LENGTH_SHORT).show();

                              showLogin();
                          });

                  screen.addView(create);

                  Button back =
                          menuButton("BACK", GRAY);

                  back.setOnClickListener(
                          v -> showRegister());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showLogin() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "LOGIN",
                                  28,
                                  BLUE,
                                  true));

                  screen.addView(
                          label(
                                  "Enter your registered account.",
                                  17,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "EMAIL",
                                  15,
                                  Color.BLACK,
                                  true));

                  EditText email =
                          input("Enter email");

                  screen.addView(email);

                  screen.addView(
                          label(
                                  "PASSWORD",
                                  15,
                                  Color.BLACK,
                                  true));

                  EditText password =
                          input("Enter password");

                  password.setInputType(0x00000081);

                  screen.addView(password);

                  Button login =
                          menuButton(
                                  "LOGIN",
                                  BLUE);

                  login.setOnClickListener(
                          v -> {

                              String enteredEmail =
                                      email.getText()
                                              .toString()
                                              .trim();

                              String enteredPassword =
                                      password.getText()
                                              .toString()
                                              .trim();

                              if (registeredEmail.isEmpty()) {

                                  Toast.makeText(
                                          this,
                                          "No account found. Register first.",
                                          Toast.LENGTH_SHORT).show();

                                  return;
                              }

                              if (enteredEmail.equals(
                                      registeredEmail) &&
                                      enteredPassword.equals(
                                              registeredPassword)) {

                                  loggedInName =
                                          registeredName;

                                  loggedInRole =
                                          registeredRole;

                                  Toast.makeText(
                                          this,
                                          "Login successful!",
                                          Toast.LENGTH_SHORT).show();

                                  showHome();

                              } else {

                                  Toast.makeText(
                                          this,
                                          "Incorrect email or password.",
                                          Toast.LENGTH_SHORT).show();
                              }
                          });

                  screen.addView(login);

                  Button register =
                          menuButton(
                                  "CREATE NEW ACCOUNT",
                                  GREEN);

                  register.setOnClickListener(
                          v -> showRegister());

                  screen.addView(register);

                  Button back =
                          menuButton("BACK", GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void checkRoleAndPassenger() {

                  if (loggedInRole.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please login as Passenger first.",
                              Toast.LENGTH_SHORT).show();

                      showLogin();
                      return;
                  }

                  if (!loggedInRole.equals("Passenger")) {

                      Toast.makeText(
                              this,
                              "This account is not a Passenger account.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  showPassenger();
              }

              private void checkRoleAndDriver() {

                  if (loggedInRole.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please login as Driver first.",
                              Toast.LENGTH_SHORT).show();

                      showLogin();
                      return;
                  }

                  if (!loggedInRole.equals("Driver")) {

                      Toast.makeText(
                              this,
                              "This account is not a Driver account.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  showDriver();
              }

              private void checkRoleAndAdmin() {

                  if (loggedInRole.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please login as Admin first.",
                              Toast.LENGTH_SHORT).show();

                      showLogin();
                      return;
                  }

                  if (!loggedInRole.equals("Admin")) {

                      Toast.makeText(
                              this,
                              "This account is not an Admin account.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  showAdmin();
              }

              private void showPassenger() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "BOOK A RIDE",
                                  28,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "Passenger: " +
                                          loggedInName,
                                  17,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "PICKUP LOCATION",
                                  15,
                                  Color.BLACK,
                                  true));

                  pickupInput =
                          input("Example: Sariaya Public Market");

                  screen.addView(pickupInput);

                  screen.addView(
                          label(
                                  "DESTINATION",
                                  15,
                                  Color.BLACK,
                                  true));

                  destinationInput =
                          input("Example: Sariaya Municipal Hall");

                  screen.addView(destinationInput);

                  screen.addView(
                          label(
                                  "RIDE TYPE",
                                  15,
                                  Color.BLACK,
                                  true));

                  screen.addView(
                          label(
                                  "🛺 Tricycle",
                                  18,
                                  GREEN,
                                  true));

                  fareText =
                          label(
                                  "Estimated fare: ₱0",
                                  20,
                                  GREEN,
                                  true);

                  screen.addView(fareText);

                  Button calculate =
                          menuButton(
                                  "CALCULATE FARE",
                                  GREEN);

                  calculate.setOnClickListener(
                          v -> calculateFare());

                  Button request =
                          menuButton(
                                  "REQUEST RIDE",
                                  GREEN);

                  request.setOnClickListener(
                          v -> requestRide());

                  Button status =
                          menuButton(
                                  "CHECK RIDE STATUS",
                                  BLUE);

                  status.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(calculate);
                  screen.addView(request);
                  screen.addView(status);
                  screen.addView(back);

                  showScreen(screen);
              }

              private void calculateFare() {

                  String pickup =
                          pickupInput.getText()
                                  .toString().trim();

                  String destination =
                          destinationInput.getText()
                                  .toString().trim();

                  if (pickup.isEmpty() ||
                          destination.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please enter pickup and destination.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  requestedFare = 50;

                  fareText.setText(
                          "Estimated fare: ₱50");
              }

              private void requestRide() {

                  String pickup =
                          pickupInput.getText()
                                  .toString().trim();

                  String destination =
                          destinationInput.getText()
                                  .toString().trim();

                  if (pickup.isEmpty() ||
                          destination.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please enter pickup and destination.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  requestedPickup = pickup;
                  requestedDestination = destination;

                  if (requestedFare == 0) {
                      requestedFare = 50;
                  }

                  rideRequested = true;
                  rideStatus = 1;

                  showPassengerStatus();
              }

              private String statusText() {

                  switch (rideStatus) {

                      case 1:
                          return "🟡 DRIVER SEARCHING\n\n" +
                                  "Waiting for an available driver.";

                      case 2:
                          return "🟢 DRIVER ACCEPTED\n\n" +
                                  "Your driver accepted the ride.";

                      case 3:
                          return "🔵 DRIVER ON THE WAY\n\n" +
                                  "Your driver is going to the pickup.";

                      case 4:
                          return "🟣 DRIVER ARRIVED\n\n" +
                                  "Your driver has arrived.";

                      case 5:
                          return "🚕 IN TRIP\n\n" +
                                  "You are traveling to your destination.";

                      case 6:
                          return "✅ RIDE COMPLETED\n\n" +
                                  "Thank you for riding with Sakay Na.";

                      default:
                          return "No active ride.";
                  }
              }

              private String driverButtonText() {

                  switch (rideStatus) {

                      case 1:
                          return "ACCEPT RIDE";

                      case 2:
                          return "START DRIVING TO PASSENGER";

                      case 3:
                          return "MARK AS ARRIVED";

                      case 4:
                          return "START TRIP";

                      case 5:
                          return "COMPLETE TRIP";

                      default:
                          return "";
                  }
              }

              private void advanceRide() {

                  if (rideStatus >= 1 &&
                          rideStatus < 6) {

                      rideStatus++;
                  }

                  Toast.makeText(
                          this,
                          "Ride status updated.",
                          Toast.LENGTH_SHORT).show();

                  showDriver();
              }

              private void showPassengerStatus() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "RIDE STATUS",
                                  28,
                                  GREEN,
                                  true));

                  if (!rideRequested) {

                      screen.addView(
                              label(
                                      "No active ride.\n\nBook a ride first.",
                                      19,
                                      Color.DKGRAY,
                                      false));

                  } else {

                      screen.addView(
                              label(
                                      statusText(),
                                      21,
                                      Color.DKGRAY,
                                      false));

                      screen.addView(
                              label(
                                      "Pickup:\n" +
                                              requestedPickup +
                                              "\n\nDestination:\n" +
                                              requestedDestination +
                                              "\n\nFare: ₱" +
                                              requestedFare,
                                      18,
                                      Color.DKGRAY,
                                      false));
                  }

                  Button refresh =
                          menuButton(
                                  "REFRESH STATUS",
                                  BLUE);

                  refresh.setOnClickListener(
                          v -> showPassengerStatus());

                  screen.addView(refresh);

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showDriver() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "DRIVER",
                                  30,
                                  BLUE,
                                  true));

                  screen.addView(
                          label(
                                  "Driver: " +
                                          loggedInName,
                                  17,
                                  Color.DKGRAY,
                                  false));

                  if (!rideRequested) {

                      screen.addView(
                              label(
                                      "NO RIDE REQUESTS",
                                      21,
                                      Color.DKGRAY,
                                      true));

                  } else {

                      screen.addView(
                              label(
                                      "CURRENT RIDE",
                                      22,
                                      BLUE,
                                      true));

                      screen.addView(
                              label(
                                      statusText(),
                                      21,
                                      Color.DKGRAY,
                                      false));

                      screen.addView(
                              label(
                                      "Pickup:\n" +
                                              requestedPickup +
                                              "\n\nDestination:\n" +
                                              requestedDestination +
                                              "\n\nFare: ₱" +
                                              requestedFare,
                                      18,
                                      Color.DKGRAY,
                                      false));

                      if (rideStatus >= 1 &&
                              rideStatus < 6) {

                          Button next =
                                  menuButton(
                                          driverButtonText(),
                                          GREEN);

                          next.setOnClickListener(
                                  v -> advanceRide());

                          screen.addView(next);

                      } else {

                          screen.addView(
                                  label(
                                          "RIDE COMPLETED",
                                          22,
                                          GREEN,
                                          true));
                      }
                  }

                  Button refresh =
                          menuButton(
                                  "REFRESH DRIVER SCREEN",
                                  BLUE);

                  refresh.setOnClickListener(
                          v -> showDriver());

                  screen.addView(refresh);

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showAdmin() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "ADMIN",
                                  30,
                                  RED,
                                  true));

                  screen.addView(
                          label(
                                  "Administrator: " +
                                          loggedInName,
                                  17,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "SYSTEM STATUS: ONLINE\n\n" +
                                          "Ride request: " +
                                          (rideRequested ? "YES" : "NO") +
                                          "\n\nCURRENT RIDE:\n" +
                                          statusText(),
                                  19,
                                  Color.DKGRAY,
                                  false));

                  Button refresh =
                          menuButton(
                                  "REFRESH ADMIN",
                                  RED);

                  refresh.setOnClickListener(
                          v -> showAdmin());

                  screen.addView(refresh);

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakayNa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
