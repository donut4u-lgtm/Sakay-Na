name: Build Sakay Na APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/sakyna/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Sakay-Na"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sakyna.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sakyna.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Sakay Na"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/sakyna/app/MainActivity.java <<'EOF'
          package com.sakyna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final int GREEN = Color.rgb(20, 110, 60);
              private static final int BLUE = Color.rgb(35, 95, 170);
              private static final int RED = Color.rgb(170, 60, 50);
              private static final int GRAY = Color.GRAY;

              private EditText pickupInput;
              private EditText destinationInput;
              private TextView fareText;

              private static boolean rideRequested = false;

              private static String requestedPickup = "";
              private static String requestedDestination = "";
              private static int requestedFare = 0;

              /*
               * Ride status:
               *
               * 0 = No ride
               * 1 = Searching
               * 2 = Accepted
               * 3 = Driver on the way
               * 4 = Driver arrived
               * 5 = In trip
               * 6 = Completed
               */

              private static int rideStatus = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private LinearLayout baseScreen() {
                  LinearLayout screen = new LinearLayout(this);
                  screen.setOrientation(LinearLayout.VERTICAL);
                  screen.setPadding(25, 30, 25, 30);
                  screen.setBackgroundColor(Color.WHITE);
                  return screen;
              }

              private void showScreen(LinearLayout screen) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.addView(screen);
                  setContentView(scroll);
              }

              private TextView label(
                      String text,
                      float size,
                      int color,
                      boolean bold) {

                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  view.setGravity(Gravity.CENTER);

                  if (bold) {
                      view.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  }

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  params.setMargins(0, 10, 0, 10);
                  view.setLayoutParams(params);

                  return view;
              }

              private Button menuButton(String text, int color) {

                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(17);
                  button.setTextColor(Color.WHITE);
                  button.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(color);
                  background.setCornerRadius(24);
                  button.setBackground(background);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  70);

                  params.setMargins(0, 10, 0, 10);
                  button.setLayoutParams(params);

                  return button;
              }

              private EditText input(String hint) {

                  EditText editText = new EditText(this);
                  editText.setHint(hint);
                  editText.setTextSize(17);
                  editText.setSingleLine(true);
                  editText.setPadding(20, 10, 20, 10);

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(Color.rgb(245, 245, 245));
                  background.setCornerRadius(18);
                  background.setStroke(1, Color.LTGRAY);

                  editText.setBackground(background);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  65);

                  params.setMargins(0, 5, 0, 15);
                  editText.setLayoutParams(params);

                  return editText;
              }

              private String statusText() {

                  switch (rideStatus) {

                      case 1:
                          return "🟡 DRIVER SEARCHING\n\n" +
                                  "Waiting for an available driver.";

                      case 2:
                          return "🟢 DRIVER ACCEPTED\n\n" +
                                  "Your driver accepted the ride.";

                      case 3:
                          return "🔵 DRIVER ON THE WAY\n\n" +
                                  "Your driver is going to the pickup location.";

                      case 4:
                          return "🟣 DRIVER ARRIVED\n\n" +
                                  "Your driver has arrived.";

                      case 5:
                          return "🚕 IN TRIP\n\n" +
                                  "You are traveling to your destination.";

                      case 6:
                          return "✅ RIDE COMPLETED\n\n" +
                                  "Thank you for riding with Sakay Na.";

                      default:
                          return "No active ride.";
                  }
              }

              private String driverButtonText() {

                  switch (rideStatus) {

                      case 1:
                          return "ACCEPT RIDE";

                      case 2:
                          return "START DRIVING TO PASSENGER";

                      case 3:
                          return "MARK AS ARRIVED";

                      case 4:
                          return "START TRIP";

                      case 5:
                          return "COMPLETE TRIP";

                      case 6:
                          return "RIDE COMPLETED";

                      default:
                          return "";
                  }
              }

              private void advanceRide() {

                  if (rideStatus == 1) {

                      rideStatus = 2;

                  } else if (rideStatus == 2) {

                      rideStatus = 3;

                  } else if (rideStatus == 3) {

                      rideStatus = 4;

                  } else if (rideStatus == 4) {

                      rideStatus = 5;

                  } else if (rideStatus == 5) {

                      rideStatus = 6;

                  }

                  Toast.makeText(
                          this,
                          statusShortText(),
                          Toast.LENGTH_SHORT).show();

                  showDriver();
              }

              private String statusShortText() {

                  switch (rideStatus) {

                      case 2:
                          return "Ride accepted!";

                      case 3:
                          return "Driver is on the way.";

                      case 4:
                          return "Driver has arrived.";

                      case 5:
                          return "Trip started.";

                      case 6:
                          return "Trip completed!";

                      default:
                          return "Status updated.";
                  }
              }

              private void showHome() {

                  LinearLayout screen = baseScreen();

                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(
                          label("🛺", 55, Color.BLACK, false));

                  screen.addView(
                          label(
                                  "Sakay Na",
                                  36,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "Your local ride, made easy",
                                  17,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "Choose your mode",
                                  20,
                                  Color.BLACK,
                                  true));

                  Button passenger =
                          menuButton("PASSENGER", GREEN);

                  Button driver =
                          menuButton("DRIVER", BLUE);

                  Button admin =
                          menuButton("ADMIN", RED);

                  passenger.setOnClickListener(
                          v -> showPassenger());

                  driver.setOnClickListener(
                          v -> showDriver());

                  admin.setOnClickListener(
                          v -> showAdmin());

                  screen.addView(passenger);
                  screen.addView(driver);
                  screen.addView(admin);

                  showScreen(screen);
              }

              private void showPassenger() {

                  LinearLayout screen = baseScreen();

                  screen.addView(
                          label(
                                  "BOOK A RIDE",
                                  28,
                                  GREEN,
                                  true));

                  screen.addView(
                          label(
                                  "Enter your pickup and destination.",
                                  17,
                                  Color.DKGRAY,
                                  false));

                  screen.addView(
                          label(
                                  "PICKUP LOCATION",
                                  15,
                                  Color.BLACK,
                                  true));

                  pickupInput =
                          input("Example: Sariaya Public Market");

                  screen.addView(pickupInput);

                  screen.addView(
                          label(
                                  "DESTINATION",
                                  15,
                                  Color.BLACK,
                                  true));

                  destinationInput =
                          input("Example: Sariaya Municipal Hall");

                  screen.addView(destinationInput);

                  screen.addView(
                          label(
                                  "RIDE TYPE",
                                  15,
                                  Color.BLACK,
                                  true));

                  screen.addView(
                          label(
                                  "🛺 Tricycle",
                                  18,
                                  GREEN,
                                  true));

                  fareText =
                          label(
                                  "Estimated fare: ₱0",
                                  20,
                                  GREEN,
                                  true);

                  screen.addView(fareText);

                  Button calculate =
                          menuButton(
                                  "CALCULATE FARE",
                                  GREEN);

                  calculate.setOnClickListener(
                          v -> calculateFare());

                  Button request =
                          menuButton(
                                  "REQUEST RIDE",
                                  GREEN);

                  request.setOnClickListener(
                          v -> requestRide());

                  Button status =
                          menuButton(
                                  "CHECK RIDE STATUS",
                                  BLUE);

                  status.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(calculate);
                  screen.addView(request);
                  screen.addView(status);
                  screen.addView(back);

                  showScreen(screen);
              }

              private void calculateFare() {

                  String pickup =
                          pickupInput.getText().toString().trim();

                  String destination =
                          destinationInput.getText().toString().trim();

                  if (pickup.isEmpty() ||
                          destination.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please enter pickup and destination.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  requestedFare = 50;

                  fareText.setText(
                          "Estimated fare: ₱50");
              }

              private void requestRide() {

                  String pickup =
                          pickupInput.getText().toString().trim();

                  String destination =
                          destinationInput.getText().toString().trim();

                  if (pickup.isEmpty() ||
                          destination.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please enter pickup and destination.",
                              Toast.LENGTH_SHORT).show();

                      return;
                  }

                  requestedPickup = pickup;
                  requestedDestination = destination;

                  if (requestedFare == 0) {
                      requestedFare = 50;
                  }

                  rideRequested = true;
                  rideStatus = 1;

                  showPassengerStatus();
              }

              private void showPassengerStatus() {

                  LinearLayout screen = baseScreen();

                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(
                          label(
                                  "RIDE STATUS",
                                  28,
                                  GREEN,
                                  true));

                  if (!rideRequested) {

                      screen.addView(
                              label(
                                      "No active ride.\n\nBook a ride first.",
                                      19,
                                      Color.DKGRAY,
                                      false));

                  } else {

                      screen.addView(
                              label(
                                      statusText(),
                                      21,
                                      Color.DKGRAY,
                                      false));

                      screen.addView(
                              label(
                                      "Pickup:\n" +
                                              requestedPickup +
                                              "\n\nDestination:\n" +
                                              requestedDestination +
                                              "\n\nFare: ₱" +
                                              requestedFare,
                                      18,
                                      Color.DKGRAY,
                                      false));
                  }

                  Button refresh =
                          menuButton(
                                  "REFRESH RIDE STATUS",
                                  BLUE);

                  refresh.setOnClickListener(
                          v -> showPassengerStatus());

                  screen.addView(refresh);

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showDriver() {

                  LinearLayout screen = baseScreen();

                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(
                          label(
                                  "DRIVER",
                                  30,
                                  BLUE,
                                  true));

                  if (!rideRequested) {

                      screen.addView(
                              label(
                                      "NO RIDE REQUESTS",
                                      21,
                                      Color.DKGRAY,
                                      true));

                      screen.addView(
                              label(
                                      "There is currently no passenger ride request.",
                                      18,
                                      Color.DKGRAY,
                                      false));

                  } else {

                      screen.addView(
                              label(
                                      "CURRENT RIDE",
                                      22,
                                      BLUE,
                                      true));

                      screen.addView(
                              label(
                                      statusText(),
                                      21,
                                      Color.DKGRAY,
                                      false));

                      screen.addView(
                              label(
                                      "Pickup:\n" +
                                              requestedPickup +
                                              "\n\nDestination:\n" +
                                              requestedDestination +
                                              "\n\nFare: ₱" +
                                              requestedFare,
                                      18,
                                      Color.DKGRAY,
                                      false));

                      if (rideStatus >= 1 &&
                              rideStatus < 6) {

                          Button next =
                                  menuButton(
                                          driverButtonText(),
                                          GREEN);

                          next.setOnClickListener(
                                  v -> advanceRide());

                          screen.addView(next);

                      } else if (rideStatus == 6) {

                          screen.addView(
                                  label(
                                          "RIDE COMPLETED",
                                          22,
                                          GREEN,
                                          true));
                      }
                  }

                  Button refresh =
                          menuButton(
                                  "REFRESH DRIVER SCREEN",
                                  BLUE);

                  refresh.setOnClickListener(
                          v -> showDriver());

                  screen.addView(refresh);

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }

              private void showAdmin() {

                  LinearLayout screen = baseScreen();

                  screen.setGravity(Gravity.CENTER_HORIZONTAL);

                  screen.addView(
                          label(
                                  "ADMIN",
                                  30,
                                  RED,
                                  true));

                  screen.addView(
                          label(
                                  "SAKAY NA ADMINISTRATION",
                                  21,
                                  Color.DKGRAY,
                                  true));

                  screen.addView(
                          label(
                                  "SYSTEM STATUS: ONLINE\n\n" +
                                          "Ride request: " +
                                          (rideRequested ? "YES" : "NO") +
                                          "\n\nCURRENT RIDE STATUS:\n\n" +
                                          statusText(),
                                  19,
                                  Color.DKGRAY,
                                  false));

                  Button refresh =
                          menuButton(
                                  "REFRESH ADMIN",
                                  RED);

                  refresh.setOnClickListener(
                          v -> showAdmin());

                  screen.addView(refresh);

                  Button back =
                          menuButton(
                                  "BACK HOME",
                                  GRAY);

                  back.setOnClickListener(
                          v -> showHome());

                  screen.addView(back);

                  showScreen(screen);
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakayNa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
