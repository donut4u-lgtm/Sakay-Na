name: Build Sakay Na

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Restore Sakay Na release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKAYNA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sakayna-release.jks

          if [ ! -s sakayna-release.jks ]; then
            echo "RED: Keystore file is empty."
            exit 1
          fi

          echo "GREEN: Existing release keystore restored."

      - name: Build signed release APK
        env:
          SAKAYNA_KEYSTORE_PATH: ${{ github.workspace }}/sakayna-release.jks
          SAKAYNA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SAKAYNA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SAKAYNA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$SAKAYNA_KEYSTORE_PASSWORD" ]; then
            echo "RED: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$SAKAYNA_KEY_PASSWORD" ]; then
            echo "RED: KEY_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$SAKAYNA_KEY_ALIAS" ]; then
            echo "RED: KEY_ALIAS secret is missing."
            exit 1
          fi

          gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          if [ ! -s "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "RED: Release APK was not produced."
            exit 1
          fi

          echo "GREEN: Sakay Na release APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-release-fixed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
