name: Build Sakay Na APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create project folders
        run: |
          mkdir -p app/src/main/java/com/sakyna/app
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Sakay-Na"
          include(":app")
          EOF

      - name: Create build.gradle.kts
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

      - name: Create app build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.sakyna.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sakyna.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Sakay Na"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/sakyna/app/MainActivity.java <<'EOF'
          package com.sakyna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.text.InputType;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Random;

          public class MainActivity extends Activity {

              /*
               * ============================================================
               * USER DATA
               * ============================================================
               */

              private static class User {
                  String name;
                  String mobile;
                  String password;
                  String role;
                  boolean verified;

                  User(String name, String mobile,
                       String password, String role) {
                      this.name = name;
                      this.mobile = mobile;
                      this.password = password;
                      this.role = role;
                      this.verified = false;
                  }
              }

              private static class Transaction {
                  String passenger;
                  String passengerMobile;
                  String driver;
                  String driverMobile;
                  String pickup;
                  String destination;
                  int fare;
                  String status;

                  Transaction(
                          String passenger,
                          String passengerMobile,
                          String driver,
                          String driverMobile,
                          String pickup,
                          String destination,
                          int fare,
                          String status) {

                      this.passenger = passenger;
                      this.passengerMobile = passengerMobile;
                      this.driver = driver;
                      this.driverMobile = driverMobile;
                      this.pickup = pickup;
                      this.destination = destination;
                      this.fare = fare;
                      this.status = status;
                  }
              }

              private static final ArrayList<User> users =
                      new ArrayList<>();

              private static final ArrayList<Transaction> transactions =
                      new ArrayList<>();

              private static String loggedInName = "";
              private static String loggedInMobile = "";
              private static String loggedInRole = "";

              private static User pendingUser = null;
              private static String pendingOtp = "";

              /*
               * ============================================================
               * RIDE DATA
               * ============================================================
               */

              /*
               * 0 = No ride
               * 1 = Searching
               * 2 = Accepted
               * 3 = Driver on the way
               * 4 = Driver arrived
               * 5 = In trip
               * 6 = Completed
               */

              private static int rideStatus = 0;

              private static boolean rideRequested = false;

              private static String requestedPickup = "";
              private static String requestedDestination = "";

              private static int requestedFare = 0;

              private static String currentPassengerName = "";
              private static String currentPassengerMobile = "";

              private static String currentDriverName = "";
              private static String currentDriverMobile = "";

              private LinearLayout content;

              /*
               * ============================================================
               * APP START
               * ============================================================
               */

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              /*
               * ============================================================
               * UI HELPERS
               * ============================================================
               */

              private void setupScreen(String title) {

                  ScrollView scrollView = new ScrollView(this);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(32, 32, 32, 32);

                  scrollView.addView(content);

                  setContentView(scrollView);

                  TextView titleView = new TextView(this);

                  titleView.setText(title);
                  titleView.setTextSize(28);
                  titleView.setTextColor(Color.BLACK);
                  titleView.setGravity(Gravity.CENTER);
                  titleView.setPadding(0, 10, 0, 30);

                  content.addView(titleView);
              }

              private TextView text(String value, int size) {

                  TextView tv = new TextView(this);

                  tv.setText(value);
                  tv.setTextSize(size);
                  tv.setTextColor(Color.DKGRAY);
                  tv.setPadding(0, 10, 0, 10);

                  content.addView(tv);

                  return tv;
              }

              private EditText input(String hint) {

                  EditText edit = new EditText(this);

                  edit.setHint(hint);
                  edit.setTextSize(18);
                  edit.setSingleLine(true);
                  edit.setPadding(20, 15, 20, 15);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  params.setMargins(0, 8, 0, 8);

                  edit.setLayoutParams(params);

                  content.addView(edit);

                  return edit;
              }

              private EditText passwordInput(String hint) {

                  EditText edit = input(hint);

                  edit.setInputType(
                          InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_VARIATION_PASSWORD);

                  return edit;
              }

              private Button button(String label) {

                  Button b = new Button(this);

                  b.setText(label);
                  b.setTextSize(17);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  params.setMargins(0, 8, 0, 8);

                  b.setLayoutParams(params);

                  content.addView(b);

                  return b;
              }

              /*
               * ============================================================
               * MOBILE NUMBER
               * ============================================================
               */

              private boolean validMobile(String mobile) {

                  return mobile != null
                          && mobile.matches("09[0-9]{9}");
              }

              /*
               * ============================================================
               * HOME
               * ============================================================
               */

              private void showHome() {

                  setupScreen("🛺 Sakay Na");

                  text(
                          "Your local tricycle ride-hailing app",
                          18);

                  if (!loggedInName.isEmpty()) {

                      text(
                              "Logged in:\n" +
                              loggedInName +
                              "\n" +
                              loggedInMobile +
                              "\nRole: " +
                              loggedInRole,
                              17);
                  }

                  Button login = button("LOGIN");

                  login.setOnClickListener(
                          v -> showLogin());

                  Button register = button("REGISTER");

                  register.setOnClickListener(
                          v -> showRegister());

                  Button passenger = button("PASSENGER");

                  passenger.setOnClickListener(
                          v -> checkPassenger());

                  Button driver = button("DRIVER");

                  driver.setOnClickListener(
                          v -> checkDriver());

                  Button admin = button("ADMIN");

                  admin.setOnClickListener(
                          v -> checkAdmin());

                  if (!loggedInName.isEmpty()) {

                      Button logout = button("LOGOUT");

                      logout.setOnClickListener(v -> {

                          loggedInName = "";
                          loggedInMobile = "";
                          loggedInRole = "";

                          Toast.makeText(
                                  this,
                                  "Logged out",
                                  Toast.LENGTH_SHORT
                          ).show();

                          showHome();
                      });
                  }
              }

              /*
               * ============================================================
               * REGISTRATION
               * ============================================================
               */

              private void showRegister() {

                  setupScreen("Register Account");

                  text(
                          "Select your account type",
                          20);

                  Button passenger =
                          button("REGISTER AS PASSENGER");

                  passenger.setOnClickListener(
                          v -> registrationForm("Passenger"));

                  Button driver =
                          button("REGISTER AS DRIVER");

                  driver.setOnClickListener(
                          v -> registrationForm("Driver"));

                  Button admin =
                          button("REGISTER AS ADMIN");

                  admin.setOnClickListener(
                          v -> registrationForm("Admin"));

                  Button back =
                          button("BACK");

                  back.setOnClickListener(
                          v -> showHome());
              }

              private void registrationForm(String role) {

                  setupScreen("Register - " + role);

                  text(
                          "Create your " +
                          role +
                          " account",
                          20);

                  EditText name =
                          input("Full name");

                  EditText mobile =
                          input("Mobile number: 09XXXXXXXXX");

                  mobile.setInputType(
                          InputType.TYPE_CLASS_PHONE);

                  EditText password =
                          passwordInput("Password");

                  Button register =
                          button("CONTINUE TO OTP");

                  register.setOnClickListener(v -> {

                      String n =
                              name.getText().toString().trim();

                      String m =
                              mobile.getText().toString().trim();

                      String p =
                              password.getText().toString();

                      if (n.isEmpty()) {

                          Toast.makeText(
                                  this,
                                  "Enter your full name",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      if (!validMobile(m)) {

                          Toast.makeText(
                                  this,
                                  "Use 09XXXXXXXXX",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      if (p.length() < 4) {

                          Toast.makeText(
                                  this,
                                  "Password must be at least 4 characters",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      for (User u : users) {

                          if (u.mobile.equals(m)) {

                              Toast.makeText(
                                      this,
                                      "Mobile number already registered",
                                      Toast.LENGTH_SHORT
                              ).show();

                              return;
                          }
                      }

                      pendingUser =
                              new User(
                                      n,
                                      m,
                                      p,
                                      role);

                      pendingOtp =
                              String.format(
                                      "%06d",
                                      new Random().nextInt(1000000));

                      showOtpVerification();
                  });

                  Button back =
                          button("BACK");

                  back.setOnClickListener(
                          v -> showRegister());
              }

              /*
               * ============================================================
               * OTP
               * ============================================================
               */

              private void showOtpVerification() {

                  setupScreen("Mobile Verification");

                  text(
                          "OTP verification",
                          22);

                  text(
                          "A verification code would normally be sent by SMS.",
                          17);

                  /*
                   * DEMO ONLY
                   *
                   * Real SMS will be added later.
                   */

                  text(
                          "DEMO OTP:\n" +
                          pendingOtp,
                          28);

                  EditText otp =
                          input("Enter 6-digit OTP");

                  otp.setInputType(
                          InputType.TYPE_CLASS_NUMBER);

                  Button verify =
                          button("VERIFY OTP");

                  verify.setOnClickListener(v -> {

                      String entered =
                              otp.getText().toString().trim();

                      if (!entered.equals(pendingOtp)) {

                          Toast.makeText(
                                  this,
                                  "Incorrect OTP",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      pendingUser.verified = true;

                      users.add(pendingUser);

                      Toast.makeText(
                              this,
                              "Registration successful",
                              Toast.LENGTH_SHORT
                      ).show();

                      pendingUser = null;
                      pendingOtp = "";

                      showLogin();
                  });

                  Button back =
                          button("BACK");

                  back.setOnClickListener(
                          v -> showRegister());
              }

              /*
               * ============================================================
               * LOGIN
               * ============================================================
               */

              private void showLogin() {

                  setupScreen("Login");

                  text(
                          "Login with mobile number",
                          20);

                  EditText mobile =
                          input("Mobile number");

                  mobile.setInputType(
                          InputType.TYPE_CLASS_PHONE);

                  EditText password =
                          passwordInput("Password");

                  Button login =
                          button("LOGIN");

                  login.setOnClickListener(v -> {

                      String m =
                              mobile.getText().toString().trim();

                      String p =
                              password.getText().toString();

                      for (User u : users) {

                          if (u.mobile.equals(m)
                                  && u.password.equals(p)
                                  && u.verified) {

                              loggedInName = u.name;
                              loggedInMobile = u.mobile;
                              loggedInRole = u.role;

                              Toast.makeText(
                                      this,
                                      "Login successful",
                                      Toast.LENGTH_SHORT
                              ).show();

                              showHome();

                              return;
                          }
                      }

                      Toast.makeText(
                              this,
                              "Invalid mobile number or password",
                              Toast.LENGTH_SHORT
                      ).show();
                  });

                  Button back =
                          button("BACK");

                  back.setOnClickListener(
                          v -> showHome());
              }

              /*
               * ============================================================
               * ROLE CHECKING
               * ============================================================
               */

              private void checkPassenger() {

                  if (loggedInName.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please login first",
                              Toast.LENGTH_SHORT
                      ).show();

                      showLogin();

                      return;
                  }

                  if (!loggedInRole.equals("Passenger")) {

                      Toast.makeText(
                              this,
                              "Passenger account required",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  showPassenger();
              }

              private void checkDriver() {

                  if (loggedInName.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please login first",
                              Toast.LENGTH_SHORT
                      ).show();

                      showLogin();

                      return;
                  }

                  if (!loggedInRole.equals("Driver")) {

                      Toast.makeText(
                              this,
                              "Driver account required",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  showDriver();
              }

              private void checkAdmin() {

                  if (loggedInName.isEmpty()) {

                      Toast.makeText(
                              this,
                              "Please login first",
                              Toast.LENGTH_SHORT
                      ).show();

                      showLogin();

                      return;
                  }

                  if (!loggedInRole.equals("Admin")) {

                      Toast.makeText(
                              this,
                              "Admin account required",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  showAdmin();
              }

              /*
               * ============================================================
               * PASSENGER
               * ============================================================
               */

              private void showPassenger() {

                  setupScreen("Passenger");

                  text(
                          "Welcome, " +
                          loggedInName,
                          21);

                  EditText pickup =
                          input("Pickup location");

                  EditText destination =
                          input("Destination");

                  Button calculate =
                          button("CALCULATE FARE");

                  TextView fareText =
                          text(
                                  "Estimated fare: ₱0",
                                  20);

                  calculate.setOnClickListener(v -> {

                      String p =
                              pickup.getText().toString().trim();

                      String d =
                              destination.getText().toString().trim();

                      if (p.isEmpty() ||
                              d.isEmpty()) {

                          Toast.makeText(
                                  this,
                                  "Enter pickup and destination",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      requestedPickup = p;
                      requestedDestination = d;
                      requestedFare = 50;

                      fareText.setText(
                              "Estimated fare: ₱" +
                              requestedFare);
                  });

                  Button request =
                          button("REQUEST RIDE");

                  request.setOnClickListener(v -> {

                      String p =
                              pickup.getText().toString().trim();

                      String d =
                              destination.getText().toString().trim();

                      if (p.isEmpty() ||
                              d.isEmpty()) {

                          Toast.makeText(
                                  this,
                                  "Enter pickup and destination",
                                  Toast.LENGTH_SHORT
                          ).show();

                          return;
                      }

                      requestedPickup = p;
                      requestedDestination = d;

                      if (requestedFare == 0) {
                          requestedFare = 50;
                      }

                      currentPassengerName =
                              loggedInName;

                      currentPassengerMobile =
                              loggedInMobile;

                      currentDriverName = "";
                      currentDriverMobile = "";

                      rideRequested = true;
                      rideStatus = 1;

                      transactions.add(
                              new Transaction(
                                      currentPassengerName,
                                      currentPassengerMobile,
                                      "",
                                      "",
                                      requestedPickup,
                                      requestedDestination,
                                      requestedFare,
                                      "Searching"));

                      Toast.makeText(
                              this,
                              "Ride requested",
                              Toast.LENGTH_SHORT
                      ).show();

                      showPassengerStatus();
                  });

                  Button status =
                          button("CHECK RIDE STATUS");

                  status.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back =
                          button("BACK HOME");

                  back.setOnClickListener(
                          v -> showHome());
              }

              /*
               * ============================================================
               * PASSENGER STATUS
               * ============================================================
               */

              private void showPassengerStatus() {

                  setupScreen("Ride Status");

                  if (!rideRequested) {

                      text(
                              "No active ride.",
                              20);

                  } else {

                      text(
                              "Passenger:\n" +
                              currentPassengerName +
                              "\n" +
                              currentPassengerMobile,
                              18);

                      text(
                              "Pickup:\n" +
                              requestedPickup,
                              18);

                      text(
                              "Destination:\n" +
                              requestedDestination,
                              18);

                      text(
                              "Fare: ₱" +
                              requestedFare,
                              18);

                      text(
                              "Driver:\n" +
                              (currentDriverName.isEmpty()
                                      ? "Searching..."
                                      : currentDriverName),
                              18);

                      text(
                              "Status:\n" +
                              statusText(),
                              24);
                  }

                  Button refresh =
                          button("REFRESH");

                  refresh.setOnClickListener(
                          v -> showPassengerStatus());

                  Button back =
                          button("BACK TO PASSENGER");

                  back.setOnClickListener(
                          v -> showPassenger());
              }

              /*
               * ============================================================
               * DRIVER
               * ============================================================
               */

              private void showDriver() {

                  setupScreen("Driver");

                  text(
                          "Welcome, " +
                          loggedInName,
                          21);

                  if (!rideRequested) {

                      text(
                              "No ride requests available.",
                              20);

                  } else {

                      text(
                              "Passenger Request",
                              23);

                      text(
                              "Passenger:\n" +
                              currentPassengerName,
                              18);

                      text(
                              "Pickup:\n" +
                              requestedPickup,
                              18);

                      text(
                              "Destination:\n" +
                              requestedDestination,
                              18);

                      text(
                              "Fare: ₱" +
                              requestedFare,
                              18);

                      text(
                              "Status:\n" +
                              statusText(),
                              20);

                      if (rideStatus == 1) {

                          Button accept =
                                  button("ACCEPT RIDE");

                          accept.setOnClickListener(v -> {

                              currentDriverName =
                                      loggedInName;

                              currentDriverMobile =
                                      loggedInMobile;

                              rideStatus = 2;

                              updateTransaction(
                                      "Accepted");

                              showDriver();
                          });

                      } else if (rideStatus == 2) {

                          Button start =
                                  button(
                                          "START DRIVING TO PASSENGER");

                          start.setOnClickListener(v -> {

                              rideStatus = 3;

                              updateTransaction(
                                      "Driver on the way");

                              showDriver();
                          });

                      } else if (rideStatus == 3) {

                          Button arrived =
                                  button(
                                          "MARK AS ARRIVED");

                          arrived.setOnClickListener(v -> {

                              rideStatus = 4;

                              updateTransaction(
                                      "Driver arrived");

                              showDriver();
                          });

                      } else if (rideStatus == 4) {

                          Button startTrip =
                                  button("START TRIP");

                          startTrip.setOnClickListener(v -> {

                              rideStatus = 5;

                              updateTransaction(
                                      "Trip in progress");

                              showDriver();
                          });

                      } else if (rideStatus == 5) {

                          Button complete =
                                  button("COMPLETE TRIP");

                          complete.setOnClickListener(v -> {

                              rideStatus = 6;

                              updateTransaction(
                                      "Completed");

                              showDriver();
                          });
                      }
                  }

                  Button back =
                          button("BACK HOME");

                  back.setOnClickListener(
                          v -> showHome());
              }

              /*
               * ============================================================
               * TRANSACTION UPDATE
               * ============================================================
               */

              private void updateTransaction(String status) {

                  if (transactions.size() == 0) {
                      return;
                  }

                  Transaction t =
                          transactions.get(
                                  transactions.size() - 1);

                  t.driver =
                          currentDriverName;

                  t.driverMobile =
                          currentDriverMobile;

                  t.status = status;
              }

              /*
               * ============================================================
               * RIDE STATUS
               * ============================================================
               */

              private String statusText() {

                  switch (rideStatus) {

                      case 1:
                          return "Searching for a driver";

                      case 2:
                          return "Driver accepted your ride";

                      case 3:
                          return "Driver is on the way";

                      case 4:
                          return "Driver has arrived";

                      case 5:
                          return "Trip in progress";

                      case 6:
                          return "Trip completed";

                      default:
                          return "No active ride";
                  }
              }

              /*
               * ============================================================
               * ADMIN DASHBOARD
               * ============================================================
               */

              private void showAdmin() {

                  setupScreen("Admin Dashboard");

                  text(
                          "Welcome, " +
                          loggedInName,
                          21);

                  text(
                          "REGISTERED USERS",
                          24);

                  int passengerCount = 0;
                  int driverCount = 0;
                  int adminCount = 0;

                  for (User u : users) {

                      if (u.role.equals("Passenger")) {
                          passengerCount++;
                      }

                      if (u.role.equals("Driver")) {
                          driverCount++;
                      }

                      if (u.role.equals("Admin")) {
                          adminCount++;
                      }
                  }

                  text(
                          "Passengers: " +
                          passengerCount +
                          "\nDrivers: " +
                          driverCount +
                          "\nAdmins: " +
                          adminCount,
                          19);

                  Button usersButton =
                          button("VIEW ALL USERS");

                  usersButton.setOnClickListener(
                          v -> showUsers());

                  Button transactionsButton =
                          button("VIEW ALL TRANSACTIONS");

                  transactionsButton.setOnClickListener(
                          v -> showTransactions());

                  Button currentRide =
                          button("MONITOR CURRENT RIDE");

                  currentRide.setOnClickListener(
                          v -> showAdminCurrentRide());

                  Button reset =
                          button("RESET CURRENT RIDE");

                  reset.setOnClickListener(v -> {

                      rideRequested = false;
                      rideStatus = 0;

                      requestedPickup = "";
                      requestedDestination = "";
                      requestedFare = 0;

                      currentPassengerName = "";
                      currentPassengerMobile = "";

                      currentDriverName = "";
                      currentDriverMobile = "";

                      Toast.makeText(
                              this,
                              "Current ride reset",
                              Toast.LENGTH_SHORT
                      ).show();

                      showAdmin();
                  });

                  Button back =
                          button("BACK HOME");

                  back.setOnClickListener(
                          v -> showHome());
              }

              /*
               * ============================================================
               * ADMIN - USERS
               * ============================================================
               */

              private void showUsers() {

                  setupScreen("All Registered Users");

                  if (users.size() == 0) {

                      text(
                              "No registered users.",
                              20);

                  } else {

                      for (int i = 0;
                           i < users.size();
                           i++) {

                          User u = users.get(i);

                          text(
                                  "USER #" +
                                  (i + 1) +
                                  "\nName: " +
                                  u.name +
                                  "\nMobile: " +
                                  u.mobile +
                                  "\nRole: " +
                                  u.role +
                                  "\nVerified: " +
                                  (u.verified
                                          ? "YES"
                                          : "NO"),
                                  18);
                      }
                  }

                  Button back =
                          button("BACK TO ADMIN");

                  back.setOnClickListener(
                          v -> showAdmin());
              }

              /*
               * ============================================================
               * ADMIN - TRANSACTIONS
               * ============================================================
               */

              private void showTransactions() {

                  setupScreen("Ride Transactions");

                  if (transactions.size() == 0) {

                      text(
                              "No transactions yet.",
                              20);

                  } else {

                      for (int i = 0;
                           i < transactions.size();
                           i++) {

                          Transaction t =
                                  transactions.get(i);

                          text(
                                  "TRANSACTION #" +
                                  (i + 1) +
                                  "\n\nPassenger: " +
                                  t.passenger +
                                  "\nPassenger Mobile: " +
                                  t.passengerMobile +
                                  "\n\nDriver: " +
                                  (t.driver.isEmpty()
                                          ? "Not assigned"
                                          : t.driver) +
                                  "\nDriver Mobile: " +
                                  (t.driverMobile.isEmpty()
                                          ? "Not assigned"
                                          : t.driverMobile) +
                                  "\n\nPickup: " +
                                  t.pickup +
                                  "\nDestination: " +
                                  t.destination +
                                  "\nFare: ₱" +
                                  t.fare +
                                  "\nStatus: " +
                                  t.status,
                                  18);
                      }
                  }

                  Button back =
                          button("BACK TO ADMIN");

                  back.setOnClickListener(
                          v -> showAdmin());
              }

              /*
               * ============================================================
               * ADMIN - CURRENT RIDE MONITOR
               * ============================================================
               */

              private void showAdminCurrentRide() {

                  setupScreen("Current Ride Monitor");

                  if (!rideRequested) {

                      text(
                              "No active ride.",
                              21);

                  } else {

                      text(
                              "PASSENGER",
                              22);

                      text(
                              currentPassengerName +
                              "\n" +
                              currentPassengerMobile,
                              18);

                      text(
                              "DRIVER",
                              22);

                      text(
                              currentDriverName.isEmpty()
                                      ? "Not assigned"
                                      : currentDriverName +
                                        "\n" +
                                        currentDriverMobile,
                              18);

                      text(
                              "TRIP",
                              22);

                      text(
                              "Pickup:\n" +
                              requestedPickup +
                              "\n\nDestination:\n" +
                              requestedDestination +
                              "\n\nFare: ₱" +
                              requestedFare +
                              "\n\nStatus:\n" +
                              statusText(),
                              19);
                  }

                  Button refresh =
                          button("REFRESH MONITOR");

                  refresh.setOnClickListener(
                          v -> showAdminCurrentRide());

                  Button back =
                          button("BACK TO ADMIN");

                  back.setOnClickListener(
                          v -> showAdmin());
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build APK
        run: |
          export PATH="$PWD/gradle-8.10.2/bin:$PATH"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakay-Na-debug
          path: app/build/outputs/apk/debug/app-debug.apk
