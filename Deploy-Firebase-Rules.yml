
name: Deploy Firebase Rules

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          file = Path.home().parent / "runner" / "work" / "_temp" / "firebase-service-account.json"

          data = json.loads(file.read_text())

          if "client_email" not in data:
              raise SystemExit("Service account JSON is missing client_email.")

          if "private_key" not in data:
              raise SystemExit("Service account JSON is missing private_key.")

          print("Firebase service account JSON is valid.")
          print("Service account:", data["client_email"])
          PY

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          PROJECT_ID=$(python3 -c 'import json; print(json.load(open("app/google-services.json"))["project_info"]["project_id"])')

          echo "Firebase project: $PROJECT_ID"

          firebase projects:list --project "$PROJECT_ID"

      - name: Deploy Firestore Rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          PROJECT_ID=$(python3 -c 'import json; print(json.load(open("app/google-services.json"))["project_info"]["project_id"])')

          echo "Deploying Firestore rules to: $PROJECT_ID"

          firebase deploy \
            --only firestore:rules \
            --project "$PROJECT_ID"

          rm -f "$RUNNER_TEMP/firebase-service-account.json"
