name: Set Sakay Na Admin Password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-admin-password:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin SDK
        run: |
          npm init -y
          npm install firebase-admin

      - name: Set Admin password
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          const serviceAccount =
            JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          const uid = "Ld3rzaCvAGNlXBDCofB3mWjgXWp2";
          const password = process.env.ADMIN_PASSWORD;

          if (!password || password.length < 6) {
            throw new Error("ADMIN_PASSWORD is missing or shorter than 6 characters.");
          }

          admin.auth().updateUser(uid, {
            password: password
          })
          .then(() => {
            console.log("Admin password updated successfully.");
            console.log("Admin UID:", uid);
          })
          .catch((error) => {
            console.error("Failed to update Admin password:", error.message);
            process.exit(1);
          });
          NODE
